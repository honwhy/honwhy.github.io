 可用于消息转换管道"},{"l":"B","t":"背压控制对流式场景很重要"},{"l":"C","t":"WebSocket 与 Streams 结合可获得更好的控制力"},{"l":"D","t":"所有浏览器对 WebSocket Stream 的支持已经完全一致"}],"key":"ABC","mode":"multiple","expl":"D 错误。WebSocket Stream 相关标准仍在推进，支持度并不统一。","modeTitle":"不定项选择题"},{"n":28,"text":"关于 INP 测量与 Event Timing 的正确关联有：","opts":[{"l":"A","t":"Event Timing API 提供交互各阶段时间戳"},{"l":"B","t":"可据此拆分 Input Delay、Processing、Presentation"},{"l":"C","t":"PerformanceObserver 可观察 event timing 条目"},{"l":"D","t":"只测量成功的交互即可，失败交互可忽略"}],"key":"ABC","mode":"multiple","expl":"D 错误。失败或取消的交互有时也能提供有价值的性能信息。","modeTitle":"不定项选择题"},{"n":29,"text":"关于 Node.js 测试隔离与并行的正确说法有：","opts":[{"l":"A","t":"并行执行通常以文件为粒度进行隔离"},{"l":"B","t":"可提高多核利用率"},{"l":"C","t":"需要注意测试间的共享状态污染"},{"l":"D","t":"并行一定比串行更快且无副作用"}],"key":"ABC","mode":"multiple","expl":"D 错误。并行可能引入竞态与资源竞争，并非无条件更快。","modeTitle":"不定项选择题"},{"n":30,"text":"关于 RSC / 流式内容缓存安全的正确认知有：","opts":[{"l":"A","t":"必须区分 public 与 private 内容"},{"l":"B","t":"缓存键应包含影响响应的关键维度"},{"l":"C","t":"错误的缓存可能导致数据泄露"},{"l":"D","t":"边缘缓存可以忽略用户登录状态"}],"key":"ABC","mode":"multiple","expl":"D 错误。用户登录状态通常是缓存键或 private 判定的重要维度。","modeTitle":"不定项选择题"}],"modeTitle":"第二部分 · 不定项选择题"}]},{"n":10,"title":"模拟试卷 10","subject":"前端专家架构师方向","sections":[{"mode":"single","name":"一、单选题（每题只有一个正确答案）","items":[{"n":1,"text":"Vue3 中 \u003ccode>v-memo\u003c/code> 指令的核心作用是什么？","opts":[{"l":"A","t":"替代 \u003ccode>v-if\u003c/code>"},{"l":"B","t":"根据依赖数组决定是否跳过该节点及其子树的更新，实现更细粒度的模板级记忆化，适合优化列表中静态或低频变化的部分"},{"l":"C","t":"只对组件生效"},{"l":"D","t":"强制每次都重新渲染"}],"key":"B","mode":"single","expl":"\u003ccode>v-memo\u003c/code> 是 Vue 提供的模板级优化手段，适合列表中局部静态内容。","modeTitle":"单选题"},{"n":2,"text":"React 中使用 \u003ccode>use(Promise)\u003c/code> 时，如果 Promise 处于 pending 状态，组件会如何表现？","opts":[{"l":"A","t":"直接抛出错误"},{"l":"B","t":"挂起（Suspend），并向上寻找最近的 Suspense 边界显示 fallback，直到 Promise resolve"},{"l":"C","t":"返回 undefined"},{"l":"D","t":"阻塞整个应用渲染"}],"key":"B","mode":"single","expl":"\u003ccode>use\u003c/code> 读取 Promise 是 React Suspense 数据获取的标准集成方式。","modeTitle":"单选题"},{"n":3,"text":"在 JavaScript 中，\u003ccode>Error\u003c/code> 对象的 \u003ccode>cause\u003c/code> 属性主要用途是什么？","opts":[{"l":"A","t":"替代 message"},{"l":"B","t":"用于链式保存原始错误，方便在捕获并重新抛出时保留完整的错误因果链，便于调试与日志分析"},{"l":"C","t":"只在 TypeError 中可用"},{"l":"D","t":"会自动被 JSON.stringify 序列化"}],"key":"B","mode":"single","expl":"\u003ccode>cause\u003c/code> 是现代错误链的标准做法，极大方便调试。","modeTitle":"单选题"},{"n":4,"text":"TypeScript 中 \u003ccode>package.json\u003c/code> 的 \u003ccode>exports\u003c/code> 字段与 \u003ccode>types\u003c/code> / \u003ccode>typesVersions\u003c/code> 配合时，最关键的解析原则是什么？","opts":[{"l":"A","t":"只看 \u003ccode>main\u003c/code> 字段"},{"l":"B","t":"条件导出（exports）优先，类型解析会跟随对应的条件路径，需要正确配置 \u003ccode>\"types\"\u003c/code> 条件或默认类型入口，否则容易出现类型与运行时不一致"},{"l":"C","t":"类型文件总是从根目录查找"},{"l":"D","t":"可以忽略 exports 直接写 types"}],"key":"B","mode":"single","expl":"\u003ccode>exports\u003c/code> 与类型入口的正确配置是库作者必须重视的细节。","modeTitle":"单选题"},{"n":5,"text":"Vite 的 \u003ccode>renderBuiltUrl\u003c/code> 选项的主要使用场景是什么？","opts":[{"l":"A","t":"只用于开发服务器"},{"l":"B","t":"自定义生产构建中资源（JS、CSS、图片等）最终生成的 URL，常用于 CDN 路径、公共路径动态计算或特殊部署需求"},{"l":"C","t":"替代 base 配置"},{"l":"D","t":"只能返回相对路径"}],"key":"B","mode":"single","expl":"\u003ccode>renderBuiltUrl\u003c/code> 是处理复杂部署路径的灵活钩子。","modeTitle":"单选题"},{"n":6,"text":"在 Tree-shaking 过程中，\u003ccode>/*#__PURE__*/\u003c/code> 注释的主要作用是什么？","opts":[{"l":"A","t":"强制保留代码"},{"l":"B","t":"告诉压缩工具（Terser、esbuild 等）该函数调用没有副作用，可以在结果未被使用时安全删除，辅助更激进的 dead-code elimination"},{"l":"C","t":"只对箭头函数生效"},{"l":"D","t":"会被 TypeScript 类型检查使用"}],"key":"B","mode":"single","expl":"\u003ccode>/*#__PURE__*/\u003c/code> 是帮助压缩工具做更优 tree-shake 的重要注解。","modeTitle":"单选题"},{"n":7,"text":"Koa 中处理 CORS 时，除了设置 \u003ccode>Access-Control-Allow-Origin\u003c/code>，还需要特别注意的安全相关点是什么？","opts":[{"l":"A","t":"只需要允许所有源"},{"l":"B","t":"动态反射 Origin 时必须做好白名单校验，并正确处理 \u003ccode>Access-Control-Allow-Credentials\u003c/code>、预检请求方法与头信息，避免安全漏洞"},{"l":"C","t":"CORS 完全由浏览器保证安全"},{"l":"D","t":"只需要处理 GET 请求"}],"key":"B","mode":"single","expl":"CORS 配置不当是常见安全风险来源。","modeTitle":"单选题"},{"n":8,"text":"数据路由中，在窗口重新获得焦点（window focus）时触发 revalidate 的主要目的是什么？","opts":[{"l":"A","t":"增加服务器压力"},{"l":"B","t":"在用户切回页面时获取最新数据，提升数据新鲜度，同时可通过配置避免过于频繁的请求"},{"l":"C","t":"只用于移动端"},{"l":"D","t":"强制刷新整个页面"}],"key":"B","mode":"single","expl":"focus revalidate 是提升 SPA 数据新鲜度的常用策略。","modeTitle":"单选题"},{"n":9,"text":"React 的 Activity 组件在 \u003ccode>mode=\"hidden\"\u003c/code> 时，通常会做出哪些优化？","opts":[{"l":"A","t":"完全卸载组件并丢失状态"},{"l":"B","t":"保留状态与 DOM（或可恢复表示），但降低更新优先级、跳过部分副作用或不进行完整提交，以减少后台资源消耗"},{"l":"C","t":"与 \u003ccode>display: none\u003c/code> 完全等价"},{"l":"D","t":"必须配合 Suspense 才能使用"}],"key":"B","mode":"single","expl":"Activity hidden 模式的核心是“保留但降本”。","modeTitle":"单选题"},{"n":10,"text":"CSS \u003ccode>@property\u003c/code> 规则的核心能力是什么？","opts":[{"l":"A","t":"只定义颜色变量"},{"l":"B","t":"注册自定义属性并指定语法类型、是否继承、初始值，使该属性可被动画、过渡，并获得更强的类型校验"},{"l":"C","t":"替代所有 CSS 变量"},{"l":"D","t":"只在运行时通过 JS 生效"}],"key":"B","mode":"single","expl":"\u003ccode>@property\u003c/code> 让 CSS 变量真正具备类型与动画能力。","modeTitle":"单选题"},{"n":11,"text":"Node.js 的 \u003ccode>fs.glob\u003c/code> / \u003ccode>fs.globSync\u003c/code>（或等效实现）相比外部 glob 库的主要优势是什么？","opts":[{"l":"A","t":"功能更多"},{"l":"B","t":"官方内置，减少外部依赖，并与 Node.js 文件系统 API 更好地集成，适合工具链与脚本场景"},{"l":"C","t":"性能必然更差"},{"l":"D","t":"只支持同步调用"}],"key":"B","mode":"single","expl":"内置 glob 减少了工具链对外部依赖的需求。","modeTitle":"单选题"},{"n":12,"text":"在岛架构中实现“部分 Hydration”时，最关键的控制维度是什么？","opts":[{"l":"A","t":"只控制图片懒加载"},{"l":"B","t":"精确决定哪些组件需要在客户端激活（hydrate），哪些保持静态 HTML，从而最小化客户端 JavaScript 执行"},{"l":"C","t":"必须让所有组件都 hydrate"},{"l":"D","t":"与 SEO 完全无关"}],"key":"B","mode":"single","expl":"部分 Hydration 的核心就是精准控制激活范围。","modeTitle":"单选题"},{"n":13,"text":"Vue3 自定义指令的 \u003ccode>getSSRProps\u003c/code> 钩子主要解决什么问题？","opts":[{"l":"A","t":"客户端动画"},{"l":"B","t":"在服务端渲染时为指令提供可序列化的 props（通常是属性或 class/style），避免指令在 SSR 阶段因缺少 DOM 而失效"},{"l":"C","t":"只用于客户端"},{"l":"D","t":"替代 mounted 钩子"}],"key":"B","mode":"single","expl":"\u003ccode>getSSRProps\u003c/code> 是自定义指令支持 SSR 的关键钩子。","modeTitle":"单选题"},{"n":14,"text":"前端使用 \u003ccode>fetch\u003c/code> 的 \u003ccode>keepalive\u003c/code> 选项的主要场景是什么？","opts":[{"l":"A","t":"保持 WebSocket 连接"},{"l":"B","t":"在页面卸载时仍能发送完请求（如日志上报、分析数据），浏览器会尽力完成这些请求"},{"l":"C","t":"加速所有请求"},{"l":"D","t":"只对 POST 生效"}],"key":"B","mode":"single","expl":"\u003ccode>keepalive\u003c/code> 专门解决页面卸载时的上报问题。","modeTitle":"单选题"},{"n":15,"text":"Long Animation Frames（LoAF）相比传统 Long Tasks，额外提供的重要归因信息通常包括什么？","opts":[{"l":"A","t":"只多了时间戳"},{"l":"B","t":"脚本执行、布局、绘制等更细致的耗时分布与责任方信息，有助于更精准定位交互卡顿原因"},{"l":"C","t":"只能测量动画"},{"l":"D","t":"与 INP 完全无关"}],"key":"B","mode":"single","expl":"LoAF 的细粒度归因是其相比 Long Tasks 的重要升级。","modeTitle":"单选题"},{"n":16,"text":"CSS \u003ccode>scroll-state\u003c/code> 查询（或类似滚动状态查询能力）试图实现的目标是什么？","opts":[{"l":"A","t":"只检测滚动条是否存在"},{"l":"B","t":"根据滚动容器的状态（是否滚动到边缘、是否正在滚动等）应用样式，减少对 JavaScript 滚动监听的依赖"},{"l":"C","t":"替代 IntersectionObserver"},{"l":"D","t":"已经完全标准化并强制开启"}],"key":"B","mode":"single","expl":"滚动状态查询是减少 JS 滚动监听的方向之一。","modeTitle":"单选题"},{"n":17,"text":"JavaScript 中可调整大小的 ArrayBuffer（\u003ccode>resizable: true\u003c/code>）的主要使用场景是什么？","opts":[{"l":"A","t":"替代普通数组"},{"l":"B","t":"在需要动态扩展或收缩二进制数据容量时避免重新分配与拷贝，适合某些流处理与协议实现"},{"l":"C","t":"性能总是更高"},{"l":"D","t":"必须与 SharedArrayBuffer 一起使用"}],"key":"B","mode":"single","expl":"可调整大小的 ArrayBuffer 适合动态二进制场景。","modeTitle":"单选题"},{"n":18,"text":"Vite 的 \u003ccode>assetsInclude\u003c/code> 配置的主要作用是什么？","opts":[{"l":"A","t":"排除资源"},{"l":"B","t":"额外指定哪些文件类型应被视为静态资源并参与资源管道处理（哈希、路径转换等），补充默认资源类型列表"},{"l":"C","t":"只影响 CSS"},{"l":"D","t":"强制内联所有匹配文件"}],"key":"B","mode":"single","expl":"\u003ccode>assetsInclude\u003c/code> 用于扩展资源管道的处理范围。","modeTitle":"单选题"},{"n":19,"text":"Zustand 的 \u003ccode>subscribeWithSelector\u003c/code> 中间件的核心价值是什么？","opts":[{"l":"A","t":"替代所有 selector"},{"l":"B","t":"允许基于 selector 的精确订阅，只有当选中的状态切片发生变化时才通知监听者，进一步减少无效更新"},{"l":"C","t":"只用于持久化"},{"l":"D","t":"会增加内存泄漏风险"}],"key":"B","mode":"single","expl":"精确订阅是进一步降低更新频率的有效手段。","modeTitle":"单选题"},{"n":20,"text":"在边缘中间件（Edge Middleware）中执行 A/B 测试或个性化重写时，最需要注意的正确性风险是什么？","opts":[{"l":"A","t":"性能一定更好"},{"l":"B","t":"避免将私有用户数据泄露到缓存键或日志中，并确保重写逻辑在边缘与源站行为一致，防止缓存污染"},{"l":"C","t":"可以随意读取所有 Cookie"},{"l":"D","t":"边缘中间件没有安全限制"}],"key":"B","mode":"single","expl":"边缘中间件的缓存与个性化必须高度重视安全与一致性。","modeTitle":"单选题"}],"modeTitle":"第一部分 · 单选题"},{"mode":"multiple","name":"二、不定项选择题（每题至少有一个正确答案，可能多选）","items":[{"n":21,"text":"关于 Vue3 \u003ccode>v-memo\u003c/code> 的正确描述有：","opts":[{"l":"A","t":"依赖数组不变时跳过更新"},{"l":"B","t":"可与 \u003ccode>v-for\u003c/code> 结合优化列表"},{"l":"C","t":"是模板级的记忆化手段"},{"l":"D","t":"可以替代所有 \u003ccode>computed\u003c/code> 与 \u003ccode>React.memo\u003c/code>"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>v-memo\u003c/code> 是特定场景的优化工具，不能替代所有记忆化手段。","modeTitle":"不定项选择题"},{"n":22,"text":"关于 React \u003ccode>use\u003c/code> 钩子与 Suspense 的正确理解有：","opts":[{"l":"A","t":"读取 pending Promise 会触发 Suspend"},{"l":"B","t":"可以读取 Context"},{"l":"C","t":"支持在条件语句中调用"},{"l":"D","t":"可以在任意异步回调中随意调用"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>use\u003c/code> 仍需在渲染阶段调用，不能在任意异步回调中随意使用。","modeTitle":"不定项选择题"},{"n":23,"text":"关于 TypeScript 类型入口与 package exports 的正确说法有：","opts":[{"l":"A","t":"exports 条件导出优先于旧的 types 字段"},{"l":"B","t":"需要正确配置 types 条件以保证类型与实现一致"},{"l":"C","t":"错误配置容易导致类型检查通过但运行时报错"},{"l":"D","t":"只影响开发环境，不影响构建"}],"key":"ABC","mode":"multiple","expl":"D 错误。类型入口错误也会影响编辑器体验与构建时的类型检查。","modeTitle":"不定项选择题"},{"n":24,"text":"关于 Tree-shaking 辅助手段的正确认知有：","opts":[{"l":"A","t":"\u003ccode>/*#__PURE__*/\u003c/code> 注释帮助压缩工具删除无用调用"},{"l":"B","t":"\u003ccode>sideEffects\u003c/code> 声明影响打包工具的删除决策"},{"l":"C","t":"两者结合可获得更好的摇树效果"},{"l":"D","t":"有了这些手段就可以忽略代码本身的副作用"}],"key":"ABC","mode":"multiple","expl":"D 错误。注解与声明只是辅助，代码本身的副作用管理仍是基础。","modeTitle":"不定项选择题"},{"n":25,"text":"关于数据重新验证策略的正确实践有：","opts":[{"l":"A","t":"窗口聚焦时 revalidate 可提升新鲜度"},{"l":"B","t":"网络重新连接时也是常见触发点"},{"l":"C","t":"需要防抖或节流避免请求风暴"},{"l":"D","t":"所有数据都应实时轮询"}],"key":"ABC","mode":"multiple","expl":"D 错误。实时轮询成本高，应根据业务对新鲜度的要求选择策略。","modeTitle":"不定项选择题"},{"n":26,"text":"关于 CSS 自定义属性与动画的正确描述有：","opts":[{"l":"A","t":"\u003ccode>@property\u003c/code> 可让自定义属性支持动画"},{"l":"B","t":"需要声明语法类型与初始值"},{"l":"C","t":"比普通 CSS 变量具备更强的类型约束"},{"l":"D","t":"注册后在所有浏览器中行为完全一致且无需降级"}],"key":"ABC","mode":"multiple","expl":"D 错误。需要考虑浏览器兼容性与渐进增强。","modeTitle":"不定项选择题"},{"n":27,"text":"关于页面卸载时数据上报的正确理解有：","opts":[{"l":"A","t":"\u003ccode>fetch\u003c/code> + \u003ccode>keepalive\u003c/code> 是常见手段"},{"l":"B","t":"\u003ccode>navigator.sendBeacon\u003c/code> 也是经典方案"},{"l":"C","t":"需要考虑请求体积与浏览器限制"},{"l":"D","t":"可以保证 100% 送达"}],"key":"ABC","mode":"multiple","expl":"D 错误。任何卸载时上报都无法保证 100% 送达。","modeTitle":"不定项选择题"},{"n":28,"text":"关于 LoAF 与交互性能分析的正确关联有：","opts":[{"l":"A","t":"LoAF 提供更细的脚本与渲染归因"},{"l":"B","t":"有助于定位 INP 高的根本原因"},{"l":"C","t":"可与 Event Timing 数据互补"},{"l":"D","t":"只要存在 LoAF，INP 就一定不合格"}],"key":"ABC","mode":"multiple","expl":"D 错误。LoAF 的存在需要结合实际时长与用户体验判断，并非绝对对应不合格。","modeTitle":"不定项选择题"},{"n":29,"text":"关于状态精确订阅的正确说法有：","opts":[{"l":"A","t":"\u003ccode>subscribeWithSelector\u003c/code> 可减少无效通知"},{"l":"B","t":"需要正确处理 selector 的稳定性"},{"l":"C","t":"与浅比较结合效果更好"},{"l":"D","t":"精确订阅可以完全消除所有重渲染"}],"key":"ABC","mode":"multiple","expl":"D 错误。精确订阅减少的是通知与计算，组件是否重渲染还取决于使用方式。","modeTitle":"不定项选择题"},{"n":30,"text":"关于边缘中间件与缓存安全的正确认知有：","opts":[{"l":"A","t":"个性化逻辑必须谨慎设计缓存键"},{"l":"B","t":"避免在缓存中存储敏感用户数据"},{"l":"C","t":"重写规则需要考虑缓存一致性"},{"l":"D","t":"边缘中间件可以无限制地执行阻塞式重计算"}],"key":"ABC","mode":"multiple","expl":"D 错误。边缘环境有严格的执行时间与资源限制。","modeTitle":"不定项选择题"}],"modeTitle":"第二部分 · 不定项选择题"}]}]</script>

<script>
(function(){
"use strict";

/* ============ data & store ============ */
var PAPERS = JSON.parse(document.getElementById('quizData').textContent);
var LS_KEY = 'arch-frontend-quiz-v1';
var store = { current: 0, papers: {} };
try{
  var saved = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(saved && saved.papers){ store = saved; }
}catch(e){}
if(!store.current || store.current<0 || store.current>=PAPERS.length) store.current = 0;
if(!store.papers) store.papers = {};

function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

function flat(p){
  var r=[];
  p.sections.forEach(function(s){ s.items.forEach(function(it){ r.push(it); }); });
  return r;
}
var ITEMS = PAPERS.map(flat);

function ps(pi){ if(!store.papers[pi]) store.papers[pi]={answers:{},graded:false}; return store.papers[pi]; }
function sel(pi,qn){ var s=ps(pi).answers[qn]||[]; return s; }
function answeredN(pi){
  return ITEMS[pi].filter(function(it){ return (ps(pi).answers[it.n]||[]).length>0; }).length;
}
function isOk(it,arr){ return (arr||[]).join('') === it.key; }

/* reveal override map */
var forceOpen = {};

/* ============ dom ============ */
function $(s){ return document.querySelector(s); }

function sheetClass(pi, it, ans){
  var st = ps(pi);
  if(st.graded){
    if(isOk(it,ans)) return 'right';
    if(ans.length) return 'wrong';
    return 'skip';
  }
  return ans.length ? 'fill' : '';
}

function buildHero(pi){
  var p = PAPERS[pi];
  var nS = p.sections[0].items.length;
  var nM = p.sections.length>1 ? p.sections[1].items.length : 0;
  return '<div class="paper-hero"><div class="kicker">Front-end Expert · Architecture Level</div>'+
   '<h2>模拟试卷 <em>'+p.n+'</em> —— '+esc(p.subject)+'</h2>'+
   '<div class="sub">深度考察「核心原理 · 源码机制 · 构建工具 · 性能体系 · 架构决策」的面试级模拟题，作答后自动判分并逐题复盘。</div>'+
   '<div class="hero-meta"><span class="mstat"><span class="dg">'+nS+'</span> 道单选题</span>'+
   '<span class="mstat"><span class="dg">'+nM+'</span> 道不定项</span>'+
   '<span class="mstat">满分 <span class="dg">30</span></span>'+
   '<span class="mstat">建议 60 分钟</span></div>'+
   '<div class="hintline"><span class="dotchip"><i></i>点击选项即可作答</span>'+
   '<span class="dotchip"><i></i>不定项须完全选对</span>'+
   '<span class="dotchip"><i></i>交卷后自动判分并展示解析</span></div></div>';
}
function esc(s){ return String(s).replace(/"/g,'&quot;'); }

function buildQuestions(pi){
  var st = ps(pi);
  var items = ITEMS[pi];
  var html = '';
  var prev = null;
  items.forEach(function(it){
    if(prev && it.mode!==prev){
      var lo = it.mode==='single' ? 1 : 21, hi = it.mode==='single' ? 20 : 30;
      html += '<div class="part-band"><span class="pill"><b>'+it.modeTitle+'</b><span>'+lo+'–'+hi+'</span></span><span class="bar"></span></div>';
    }
    prev = it.mode;
    html += questionCard(pi, it);
  });
  return html;
}

function questionCard(pi, it){
  var st = ps(pi);
  var ans = st.answers[it.n]||[];
  var graded = !!st.graded;
  var ok = isOk(it, ans);
  var tag;
  if(!graded) tag = ans.length ? ['s-answered','已作答'] : ['s-none','未作答'];
  else if(ok) tag = ['s-right','✓ 回答正确'];
  else if(ans.length) tag = ['s-wrong','✗ 回答错误'];
  else tag = ['s-none','未作答'];

  var optsHtml = it.opts.map(function(o){
    var chosen = ans.indexOf(o.l)>=0;
    var cls='', mark='';
    if(graded){
      var isK = it.key.indexOf(o.l)>=0;
      if(isK){ cls='st-correct'; }
      else if(chosen){ cls='st-wrong'; }
      mark = chosen ? (isK?'✓':'✗') : (isK ? '✓ 漏选':'');
    } else if(chosen){ cls='selected'; mark='✓'; }
    return '<button type="button" class="opt '+cls+'" data-q="'+it.n+'" data-l="'+o.l+'">'+
      '<span class="oval '+(graded?'plain':o.l.toLowerCase())+'">'+o.l+'</span>'+
      '<span class="txt">'+o.t+'</span>'+
      '<span class="mark">'+mark+'</span></button>';
  }).join('');

  return '<article class="qcard'+(graded?(ok?' good':' bad'):'')+(graded?' locked':'')+'" id="q-'+it.n+'" data-q="'+it.n+'">'+
    '<div class="q-head"><div class="qtags"><span class="schip '+it.mode+'">'+(it.mode==='single'?'单选题':'不定项')+'</span>'+
    '<span class="qno"><small>Q</small>'+it.n+'</span></div>'+
    '<span class="qstate '+tag[0]+'">'+tag[1]+'</span></div>'+
    '<h3 class="q-text">'+it.text+'</h3>'+
    '<div class="opts">'+optsHtml+'</div>'+
    '<div class="q-explain hidden"><div class="ex-head"><span class="ex-title">答案解析</span>'+
    '<span class="ex-keys"><span class="klab">正确答案</span>'+
    it.key.split('').map(function(l){ return '<span class="kpill">'+l+'</span>'; }).join('')+'</span></div>'+
    '<div class="ex-text">'+(it.expl||'（本题暂无补充解析）')+'</div></div>'+
    '</article>';
}

function buildResult(pi){
  var items = ITEMS[pi];
  var correct = 0; var wrong = [];
  items.forEach(function(it){ if(isOk(it, ps(pi).answers[it.n]||[])) correct++; else wrong.push(Number(it.n)); });
  var total = items.length;
  var pct = Math.round(correct/total*100);
  var color = pct>=85 ? 'var(--ok)' : (pct>=60 ? 'var(--warn)' : 'var(--bad)');
  var R=45, CIRC=2*Math.PI*R;
  var html = '<div class="paper-hero result" id="resultCard"><div class="res-top">'+
    '<div class="ringwrap"><svg width="120" height="120">'+
    '<circle class="ring-bg" cx="60" cy="60" r="'+R+'" fill="none" stroke-width="11"/>'+
    '<circle class="ring-fg" cx="60" cy="60" r="'+R+'" fill="none" stroke-width="11" stroke="'+color+'" '+
    'stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+CIRC+'" style="transition:none"/></svg>'+
    '<div class="ring-num"><div><b>'+correct+'</b><span>/ '+total+' 题正确</span></div></div></div>'+
    '<div class="res-stats">'+
    '<div class="stat ok"><b>'+correct+'</b><span>答对</span></div>'+
    '<div class="stat bad"><b>'+(total-correct)+'</b><span>未全对</span></div>'+
    '<div class="stat gain"><b>'+correct+'</b><span>得分 / '+total+'</span></div>'+
    '</div></div>'+
    '<div class="res-note">判分完成。绿色为<b>正确答案</b>，红色为你的<b>错误选择</b>，虚线描边为<b>漏选的正确答案</b>；作答错误的题目解析已自动展开，其余可点击「展开全部解析」复盘。</div>'+
    (wrong.length?'<div class="wronglist"><span class="wlab">未全对的题号</span>'+
      wrong.map(function(n){ return '<span class="wchip" data-jump="'+n+'">'+n+'</span>'; }).join('')+'</div>':'')+
    '</div>';
  setTimeout(function(){
    var fg = document.querySelector('#resultCard .ring-fg');
    if(fg){ fg.style.strokeDashoffset = CIRC*(1-pct/100); }
  }, 80);
  return html;
}

function buildSidebar(pi){
  var st = ps(pi);
  var items = ITEMS[pi];
  var n = answeredN(pi);
  var cells = items.map(function(it){
    var a = st.answers[it.n]||[];
    return '<span class="cell '+sheetClass(pi,it,a)+'" data-jump="'+it.n+'">'+it.n+'</span>';
  }).join('');
  var panel;
  if(!st.graded){
    panel = '<div class="score-panel"><div class="sp-num" style="--p:'+(n/items.length*100)+'"><b>'+n+'<i>/'+items.length+'</i></b></div>'+
      '<div class="sp-txt"><b>答题进度</b><span>已作答 '+n+' / '+items.length+' 题</span></div>'+
      '<span class="grade-badge ing">作答中</span></div>';
  }else{
    var correct = 0; items.forEach(function(it){ if(isOk(it, st.answers[it.n]||[])) correct++; });
    panel = '<div class="score-panel"><div class="sp-num" style="--p:'+(correct/items.length*100)+'"><b>'+correct+'<i>分</i></b></div>'+
      '<div class="sp-txt"><b>本卷得分</b><span>正确 '+correct+' / '+items.length+' 题</span></div>'+
      '<span class="grade-badge">已判分</span></div>';
  }
  var actions = st.graded
    ? '<button class="btn btn-ghost" id="againBtn">重新作答本卷</button>'+
      '<button class="btn btn-soft" id="revealAllBtn">收起全部解析</button>'
    : '<button class="btn btn-primary" id="gradeBtn">交卷 · 判分</button>'+
      '<button class="btn btn-ghost" id="clearBtn">清空本卷答案</button>';
  return panel +
    '<div class="sheet"><div class="sheet-head"><h3><span class="ico">&#9776;</span>答题卡</h3>'+
    '<span class="answered"><b>'+n+'</b> / '+items.length+'</span></div>'+
    '<div class="sheet-body"><div class="grid30" id="grid30">'+cells+'</div></div>'+
    '<div class="legend"><span><i class="c1"></i>已作答</span><span><i class="c2"></i>正确</span>'+
    '<span><i class="c3"></i>错误</span><span><i class="c4"></i>未答</span></div>'+
    '<div class="sheet-actions">'+actions+'</div></div>';
}

function buildDock(pi){
  var st = ps(pi);
  var items = ITEMS[pi];
  var n = answeredN(pi);
  var cells = items.map(function(it){
    var a = st.answers[it.n]||[];
    return '<span class="dgcell '+sheetClass(pi,it,a)+'" data-jump="'+it.n+'">'+it.n+'</span>';
  }).join('');
  var btn = st.graded
    ? '<button class="btn btn-ghost" id="d-againBtn">重新作答</button>'
    : '<button class="btn btn-primary" id="d-gradeBtn">交卷判分</button>';
  return '<div class="dock-top"><span class="d-count">已答 <b>'+n+'</b>/'+items.length+'</span>'+
    '<div class="d-actions">'+btn+'</div></div><div class="dock-grid">'+cells+'</div>';
}

function refreshExpl(){
  var pi = store.current, st = ps(pi);
  var items = ITEMS[pi];
  document.querySelectorAll('#qcolWrap .qcard').forEach(function(card){
    var qn = card.getAttribute('data-q');
    var it = items[Number(qn)-1];
    var ok = isOk(it, st.answers[qn]||[]);
    var exp = card.querySelector('.q-explain');
    var open = false;
    if(st.graded){
      var answered = (st.answers[qn]||[]).length>0;
      open = (forceOpen[qn]!==undefined) ? forceOpen[qn] : (answered && !ok);
    }
    exp.classList.toggle('hidden', !open);
  });
}

function render(){
  var pi = store.current;
  var st = ps(pi);

  // tabs
  var tabs = $('#paperTabs');
  tabs.innerHTML = PAPERS.map(function(p){
    var done = ps(p.n-1).graded;
    return '<button class="tabbtn'+(p.n-1===pi?' active':'')+'" data-paper="'+(p.n-1)+'">'+
      (done?'<span class="done"></span>':'')+
      '<span class="no">'+String(p.n).padStart(2,'0')+'</span>第 '+p.n+' 套</button>';
  }).join('');

  // questions
  var html = buildHero(pi);
  if(st.graded) html += buildResult(pi);
  html += buildQuestions(pi);
  $('#qcolWrap').innerHTML = html;

  $('#sidebar').innerHTML = buildSidebar(pi);
  $('#dock').innerHTML = buildDock(pi);

  refreshExpl();
}

/* ============ interactions ============ */
function jump(qn){
  var card = document.getElementById('q-'+qn);
  if(!card) return;
  document.querySelectorAll('.qcard.is-current').forEach(function(c){ c.classList.remove('is-current'); });
  card.scrollIntoView({behavior:'smooth', block:'start'});
  card.classList.add('is-current');
  setTimeout(function(){ card.classList.remove('is-current'); }, 1700);
}

function wire(){
  $('#qcolWrap').addEventListener('click', function(e){
    var t = e.target.closest('[data-jump]');
    if(t){ jump(t.getAttribute('data-jump')); return; }
    var opt = e.target.closest('.opt');
    if(!opt) return;
    var pi = store.current, st = ps(pi);
    if(st.graded) return;
    var qn = opt.getAttribute('data-q');
    var l = opt.getAttribute('data-l');
    var it = ITEMS[pi][Number(qn)-1];
    var cur = st.answers[qn]||[];
    var arr;
    if(it.mode==='single') arr = cur.indexOf(l)>=0 ? [] : [l];
    else arr = cur.indexOf(l)>=0 ? cur.filter(function(x){return x!==l;}) : cur.concat([l]);
    arr = arr.slice().sort();
    st.answers[qn] = arr;
    persist();
    updateCard(pi, qn);
    updatePanels(pi);
  });

  $('#dock').addEventListener('click', function(e){
    var t = e.target.closest('[data-jump]');
    if(t){ jump(t.getAttribute('data-jump')); return; }
    if(e.target.closest('#d-gradeBtn')){ grade(); }
    else if(e.target.closest('#d-againBtn')){ resetAll(); }
  });

  $('#sidebar').addEventListener('click', function(e){
    var t = e.target.closest('[data-jump]');
    if(t){ jump(t.getAttribute('data-jump')); return; }
    if(e.target.closest('#gradeBtn')){ grade(); }
    else if(e.target.closest('#clearBtn')){ clearOnly(); }
    else if(e.target.closest('#againBtn')){ resetAll(); }
    else if(e.target.closest('#revealAllBtn')){ toggleRevealAll(); }
  });

  function grade(){
    var pi = store.current, st = ps(pi);
    var total = ITEMS[pi].length, n = answeredN(pi);
    if(n < total && !confirm('还有 '+(total-n)+' 题未作答，确定直接交卷判分吗？')) return;
    st.graded = true;
    forceOpen = {};
    persist();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function clearOnly(){
    var pi = store.current, st = ps(pi);
    if(!confirm('确定清空本卷全部作答？')) return;
    st.answers = {}; st.graded = false; forceOpen = {};
    persist(); render();
  }
  function resetAll(){
    var pi = store.current, st = ps(pi);
    if(!confirm('重新作答将清空本卷作答与判分结果，是否继续？')) return;
    st.answers = {}; st.graded = false; forceOpen = {};
    persist(); render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function toggleRevealAll(){
    var pi = store.current;
    var btn = $('#revealAllBtn');
    var anyHidden = false;
    document.querySelectorAll('#qcolWrap .qcard').forEach(function(card){
      if(card.querySelector('.q-explain').classList.contains('hidden')) anyHidden = true;
    });
    var open = anyHidden; // if something is hidden -> open all, else collapse all
    document.querySelectorAll('#qcolWrap .qcard').forEach(function(card){
      forceOpen[card.getAttribute('data-q')] = open;
    });
    refreshExpl();
    if(btn) btn.textContent = open ? '收起全部解析' : '展开全部解析';
  }
}

function updateCard(pi, qn){
  var st = ps(pi);
  var it = ITEMS[pi][Number(qn)-1];
  var ans = st.answers[qn]||[];
  var card = document.getElementById('q-'+qn);
  var tag = ans.length ? ['s-answered','已作答'] : ['s-none','未作答'];
  var qs = card.querySelector('.qstate');
  qs.className = 'qstate '+tag[0]; qs.textContent = tag[1];
  card.querySelectorAll('.opt').forEach(function(b){
    var l = b.getAttribute('data-l');
    var chosen = ans.indexOf(l)>=0;
    b.classList.toggle('selected', chosen);
    var mk = b.querySelector('.mark');
    if(chosen){ mk.textContent='✓'; mk.style.opacity=''; mk.style.transform=''; }
    else { mk.textContent=''; }
  });
}

function updatePanels(pi){
  var st = ps(pi);
  var items = ITEMS[pi];
  var n = answeredN(pi);
  // sheet cells
  document.querySelectorAll('#grid30 .cell').forEach(function(c){
    var qn = c.getAttribute('data-jump');
    var a = st.answers[qn]||[];
    c.className = 'cell '+sheetClass(pi, items[Number(qn)-1], a);
  });
  // progress panel number
  var num = $('#sidebar .score-panel .sp-num');
  if(num){
    num.style.setProperty('--p', (n/items.length*100));
    var b = num.querySelector('b'); if(b) b.innerHTML = n+'<i>/'+items.length+'</i>';
    var sp = $('#sidebar .score-panel .sp-txt span');
    if(sp) sp.textContent = '已作答 '+n+' / '+items.length+' 题';
  }
  var hb = $('#sidebar .sheet .answered b'); if(hb) hb.textContent = n;
  var dc = $('#dock .d-count'); if(dc) dc.innerHTML = '已答 <b>'+n+'</b>/'+items.length;
  document.querySelectorAll('#dock .dgcell').forEach(function(c){
    var qn = c.getAttribute('data-jump');
    var a = st.answers[qn]||[];
    c.className = 'dgcell '+sheetClass(pi, items[Number(qn)-1], a);
  });
}

/* tabs + theme */
$('#paperTabs').addEventListener('click', function(e){
  var t = e.target.closest('.tabbtn');
  if(!t) return;
  var idx = Number(t.getAttribute('data-paper'));
  if(idx===store.current) return;
  store.current = idx;
  forceOpen = {};
  persist();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
$('#themeBtn').addEventListener('click', function(){
  var root = document.documentElement;
  var next = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('quiz-theme', next); }catch(e){}
});

/* init */
try{
  var th = localStorage.getItem('quiz-theme');
  if(th) document.documentElement.setAttribute('data-theme', th);
}catch(e){}
wire();
render();

})();
</script>
</body>
</html>
