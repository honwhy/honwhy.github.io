<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前端专家架构师 · 在线模拟试卷（10 套精选题库）</title>
<meta name="description" content="覆盖 Vue3 / React / 构建工具 / 浏览器原理 / 性能体系 / 架构深度共 10 套、300 道前端专家架构师模拟题，支持在线作答、自动判分与逐题解析。">
<style>
:root{
  --brand:#4f46e5; --brand2:#7c3aed;
  --ok:#16a34a; --ok-soft:rgba(22,163,74,.12);
  --bad:#e11d48; --bad-soft:rgba(225,29,72,.1);
  --warn:#d97706;
  --c-a:#4f46e5; --c-a-bg:#eef2ff;
  --c-b:#0284c7; --c-b-bg:#e0f2fe;
  --c-c:#b45309; --c-c-bg:#fef3c7;
  --c-d:#e11d48; --c-d-bg:#ffe4e6;
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg-deco:#e3e8f6;
  --surface:#ffffff; --surface-2:#f6f7fc; --surface-3:#eef0f8;
  --ink:#1b2140; --ink-2:#5a6278; --ink-3:#9aa1b6;
  --line:#e4e7f1; --line-2:#d5d9e8;
  --shadow:0 1px 2px rgba(24,31,70,.05),0 10px 30px -12px rgba(24,31,70,.18);
  --shadow-lg:0 18px 50px -20px rgba(24,31,70,.28);
  --glass:rgba(255,255,255,.85);
}
html[data-theme="dark"]{
  --bg:#0d1020; --bg-deco:#151932;
  --surface:#171a2d; --surface-2:#1d2138; --surface-3:#232845;
  --ink:#eef0fa; --ink-2:#a7adc6; --ink-3:#6b7191;
  --line:#282d48; --line-2:#363c5e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px -14px rgba(0,0,0,.55);
  --shadow-lg:0 20px 55px -22px rgba(0,0,0,.7);
  --glass:rgba(23,26,45,.82);
  --c-a:#a5b4fc; --c-a-bg:rgba(99,102,241,.16);
  --c-b:#7dd3fc; --c-b-bg:rgba(14,165,233,.16);
  --c-c:#fcd34d; --c-c-bg:rgba(245,158,11,.15);
  --c-d:#fda4af; --c-d-bg:rgba(244,63,94,.15);
  --ok-soft:rgba(34,197,94,.14);
  --bad-soft:rgba(244,63,94,.14);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; line-height:1.6; letter-spacing:.01em;
  background-image:radial-gradient(1100px 500px at 8% -8%,var(--bg-deco),transparent 60%),
                   radial-gradient(900px 480px at 100% 0%,var(--bg-deco),transparent 55%);
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(99,102,241,.28)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
*::-webkit-scrollbar{width:10px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* header */
.sitehead{position:relative;overflow:hidden;
  background:linear-gradient(118deg,#10122f 0%,#1f1a55 44%,#47287f 100%);color:#fff}
.sitehead::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(460px 280px at 10% -50%,rgba(255,255,255,.16),transparent 70%),
             radial-gradient(540px 340px at 94% 140%,rgba(167,139,250,.32),transparent 70%)}
.sitehead .in{position:relative;max-width:1200px;margin:0 auto;padding:32px 26px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand{display:flex;gap:16px;align-items:center}
.logo{width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07));
  border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -10px rgba(0,0,0,.5);
  font-family:Georgia,"Songti SC",serif;font-weight:700;font-size:27px;color:#fff}
.brand h1{font-size:21px;font-weight:800;letter-spacing:.02em;line-height:1.3}
.brand h1 b{background:linear-gradient(90deg,#c7d2fe,#ecd9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin-top:4px;font-size:12.5px;color:rgba(255,255,255,.64);letter-spacing:.04em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);
  color:#fff;font-size:17px;display:grid;place-items:center;transition:.2s}
.iconbtn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.theme-ico .sun{display:none}
html[data-theme="dark"] .theme-ico .sun{display:inline}
html[data-theme="dark"] .theme-ico .moon{display:none}

/* sticky paper tabs */
.tabsbar{position:sticky;top:0;z-index:60;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.tabsbar .in{max-width:1200px;margin:0 auto;padding:10px 26px;display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none}
.tabsbar .in::-webkit-scrollbar{display:none}
.tabbtn{flex:none;display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-size:13.5px;font-weight:600;transition:.18s}
.tabbtn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.tabbtn .no{font-family:Georgia,serif;font-weight:700;font-size:13px;color:var(--ink-3)}
.tabbtn.active{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;
  box-shadow:0 8px 18px -8px rgba(79,70,229,.7)}
.tabbtn.active .no{color:rgba(255,255,255,.85)}
.tabbtn .done{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}

/* layout */
.page{max-width:1200px;margin:0 auto;padding:22px 26px 96px;display:grid;
  grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.qcol{min-width:0}
.byline{font-size:12.5px;color:var(--ink-3);margin:6px 2px 16px;letter-spacing:.03em;line-height:1.8}
.byline b{color:var(--ink-2)}

.paper-hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px}
.paper-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--brand),var(--brand2),#d946ef)}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--brand);text-transform:uppercase}
.paper-hero h2{margin-top:8px;font-size:23px;font-weight:800;letter-spacing:.01em}
.paper-hero h2 em{font-style:normal;font-family:Georgia,"Songti SC",serif;color:var(--brand)}
.paper-hero .sub{margin-top:6px;color:var(--ink-2);font-size:13.5px;line-height:1.8}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mstat{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.mstat .dg{color:var(--brand);font-weight:800;font-family:Georgia,serif}
.hintline{margin-top:12px;font-size:12.5px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap}
.hintline .dotchip{display:inline-flex;align-items:center;gap:6px}
.hintline .dotchip i{width:8px;height:8px;border-radius:50%;background:var(--brand)}

/* questions */
.part-band{display:flex;align-items:center;gap:14px;margin:26px 0 16px}
.part-band .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.part-band .pill{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;
  padding:7px 13px;display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700}
.part-band .pill b{color:var(--brand)}
.part-band .pill span{color:var(--ink-3);font-weight:600}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:20px 22px 18px;margin-bottom:16px;scroll-margin-top:96px;
  transition:box-shadow .25s;position:relative;animation:rise .45s ease both}
.qcard:hover{box-shadow:var(--shadow-lg)}
.qcard.is-current{box-shadow:0 0 0 2px var(--brand),var(--shadow-lg)}
.qcard.bad{border-color:rgba(225,29,72,.45)}
.qcard.good{border-color:rgba(22,163,74,.45)}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.qtags{display:flex;align-items:center;gap:10px}
.schip{font-size:11.5px;font-weight:800;letter-spacing:.04em;border-radius:7px;padding:3px 9px}
.schip.single{color:var(--brand);background:var(--c-a-bg)}
.schip.multiple{color:var(--c-c);background:var(--c-c-bg)}
.qno{font-family:Georgia,"Songti SC",serif;font-weight:700;font-size:16px;color:var(--ink);
  display:inline-flex;align-items:baseline}
.qno small{font-size:11px;color:var(--ink-3);margin-right:2px;font-family:inherit}
.qstate{font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;flex:none}
.qstate.s-none{color:var(--ink-3);background:var(--surface-3)}
.qstate.s-answered{color:var(--brand);background:var(--c-a-bg)}
.qstate.s-right{color:var(--ok);background:var(--ok-soft)}
.qstate.s-wrong{color:var(--bad);background:var(--bad-soft)}
.q-text{font-size:15.5px;font-weight:550;line-height:1.78;color:var(--ink);margin-bottom:14px}
.q-text code,.opt .txt code{background:var(--surface-3);border:1px solid var(--line);border-radius:5px;
  padding:.5px 6px;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;font-size:13px;color:#6d5bd0}
html[data-theme="dark"] .q-text code,html[data-theme="dark"] .opt .txt code{color:#c4b5fd}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 14px;
  transition:.16s;font-size:14.5px;line-height:1.66;color:var(--ink)}
.opt:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateX(2px)}
.opt .oval{flex:none;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:13px;font-family:Georgia,serif;margin-top:1px;transition:.16s}
.opt .oval.a{background:var(--c-a-bg);color:var(--c-a)}
.opt .oval.b{background:var(--c-b-bg);color:var(--c-b)}
.opt .oval.c{background:var(--c-c-bg);color:var(--c-c)}
.opt .oval.d{background:var(--c-d-bg);color:var(--c-d)}
.opt .oval.plain{background:var(--surface-3);color:var(--ink-3)}
.opt .txt{flex:1}
.opt .mark{flex:none;width:20px;font-size:15px;font-weight:800;margin-top:2px;display:grid;place-items:center;
  opacity:0;transform:scale(.4);transition:.15s}
.opt.selected{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface));
  box-shadow:0 6px 16px -10px var(--brand)}
.opt.selected .oval{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 10px -4px var(--brand)}
.opt.selected .mark{opacity:1;transform:none;color:var(--brand);content:"✓"}
.qcard.locked .opt{cursor:default}
.qcard.locked .opt:hover{transform:none;background:var(--surface)}
.qcard.locked .opt.st-correct:hover{background:var(--ok-soft)}
.qcard.locked .opt.st-wrong:hover{background:var(--bad-soft)}
.qcard.locked .opt.st-miss:hover{background:transparent}
.opt.st-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.st-correct .oval{background:var(--ok);color:#fff;box-shadow:0 4px 10px -4px var(--ok)}
.opt.st-correct .mark{opacity:1;transform:none;color:var(--ok)}
.opt.st-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.st-wrong .oval{background:var(--bad);color:#fff;box-shadow:0 4px 10px -4px var(--bad)}
.opt.st-wrong .mark{opacity:1;transform:none;color:var(--bad)}
.opt.st-miss{border-color:var(--ok);border-style:dashed;background:transparent}
.opt.st-miss .oval{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.st-miss .mark{opacity:1;transform:none;color:var(--ok);width:auto;font-size:11.5px;font-weight:700}

.q-explain{margin-top:16px;border-top:1px dashed var(--line-2);padding-top:14px;animation:fadein .3s}
.q-explain.hidden{display:none}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ex-title{font-size:12.5px;font-weight:800;color:var(--brand);letter-spacing:.12em;display:flex;align-items:center;gap:7px}
.ex-title::before{content:"";width:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.ex-keys{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.ex-keys .klab{font-weight:600}
.kpill{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:8px;
  background:var(--ok-soft);color:var(--ok);font-weight:800;font-family:Georgia,serif;font-size:14px;
  border:1px solid rgba(22,163,74,.35)}
.ex-text{font-size:13.5px;line-height:1.9;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.ex-text code{background:var(--surface-3);border:1px solid var(--line);border-radius:4px;
  padding:0 5px;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12.5px;color:#6d5bd0}
html[data-theme="dark"] .ex-text code{color:#c4b5fd}

/* result hero */
.res-top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ringwrap{position:relative;flex:none}
.ringwrap svg{transform:rotate(-90deg);display:block}
.ring-bg{stroke:var(--surface-3)}
.ring-fg{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-num b{font-size:32px;font-weight:800;font-family:Georgia,serif;color:var(--ink);line-height:1}
.ring-num span{font-size:11px;color:var(--ink-3);display:block;margin-top:3px;letter-spacing:.08em}
.res-stats{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 20px;min-width:88px}
.stat b{display:block;font-size:21px;font-weight:800;font-family:Georgia,serif;line-height:1.2}
.stat span{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.gain b{color:var(--brand)}
.res-note{margin-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.8;
  border-top:1px dashed var(--line);padding-top:12px}
.res-note b{color:var(--ink-2)}
.wronglist{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wronglist .wlab{font-size:12px;color:var(--ink-3);margin-right:2px}
.wchip{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:var(--bad-soft);color:var(--bad);cursor:pointer;border:1px solid rgba(225,29,72,.25);transition:.15s}
.wchip:hover{transform:translateY(-2px);box-shadow:0 6px 14px -8px var(--bad)}

/* sidebar */
.sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px}
.score-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:16px 18px;display:flex;align-items:center;gap:14px}
.sp-num{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p,0)*1%),var(--surface-3) 0);position:relative}
.sp-num::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.sp-num b{position:relative;font-family:Georgia,serif;font-size:19px;font-weight:800;color:var(--brand);line-height:1}
.sp-num b i{font-style:normal;font-size:11px;color:var(--ink-3)}
.sp-txt{flex:1}
.sp-txt b{font-size:14px;display:block;line-height:1.3}
.sp-txt span{font-size:12px;color:var(--ink-3)}
.grade-badge{font-size:11px;font-weight:800;color:var(--ok);letter-spacing:.08em;border-radius:999px;
  background:var(--ok-soft);padding:3px 9px;flex:none}
.grade-badge.ing{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.sheet .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.sheet .sheet-head h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.sheet .sheet-head h3 .ico{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-size:13px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.sheet .answered{font-size:12px;color:var(--ink-3);font-weight:600}
.sheet .answered b{color:var(--brand);font-family:Georgia,serif;font-size:15px}
.sheet-body{padding:14px 16px}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.cell{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink-3);
  font-family:Georgia,serif;transition:.13s;cursor:pointer}
.cell:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.cell.fill{border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  box-shadow:0 4px 10px -5px var(--brand)}
.cell.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.skip{border-style:dashed;color:var(--ink-3);opacity:.8}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 18px 13px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3.5px;flex:none}
.legend i.c1{background:linear-gradient(135deg,var(--brand),var(--brand2))}
.legend i.c2{background:var(--ok)}
.legend i.c3{background:var(--bad)}
.legend i.c4{border:1.5px dashed var(--line-2)}
.sheet-actions{padding:0 16px 16px;display:flex;flex-direction:column;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;
  font-weight:700;font-size:14px;padding:11px 16px;border:1.5px solid transparent;transition:.16s;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  box-shadow:0 10px 20px -10px var(--brand)}
.btn-primary:hover{filter:brightness(1.07);box-shadow:0 14px 26px -12px var(--brand)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none}
.btn-ghost{border-color:var(--line-2);background:var(--surface);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--bad);color:var(--bad)}
.btn-soft{border-color:var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.btn-soft:hover{border-color:var(--brand);color:var(--brand)}

/* mobile dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);box-shadow:0 -12px 34px -20px rgba(0,0,0,.45);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.dock .dock-top{display:flex;align-items:center;gap:10px}
.dock .d-count{font-size:13px;font-weight:700;color:var(--ink-2);flex:none}
.dock .d-count b{color:var(--brand);font-family:Georgia,serif}
.dock .d-actions{display:flex;gap:8px;flex:1;justify-content:flex-end}
.dock .btn{padding:9px 14px;font-size:13.5px}
.dock-grid{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding:2px;scrollbar-width:none}
.dock-grid::-webkit-scrollbar{display:none}

<script id="quizData" type="application/json">[{"n":1,"title":"模拟试卷 1","subject":"前端专家架构师方向","sections":[{"mode":"single","name":"一、单选题（每题只有一个正确答案）","items":[{"n":1,"text":"在 Vue3 的响应式系统中，使用 Proxy 替代 Object.defineProperty 实现响应式，其最核心、最不可替代的优势体现在以下哪个场景？","opts":[{"l":"A","t":"对数组通过下标进行访问和修改时的拦截效率更高"},{"l":"B","t":"能够直接拦截对象属性的新增（add）与删除（delete）操作，而无需预先定义属性"},{"l":"C","t":"对基本类型（string、number 等）的包装对象处理更完善"},{"l":"D","t":"在原型链上查找属性时性能显著优于 defineProperty"}],"key":"B","mode":"single","expl":"Object.defineProperty 只能劫持已经存在的属性，新增或删除属性无法被感知，必须通过 Vue.set / Vue.delete 额外处理。Proxy 可以直接拦截 defineProperty、deleteProperty 等操作，这是最本质的优势。A 虽然 Proxy 对数组也更好，但不是“最核心不可替代”的点。","modeTitle":"单选题"},{"n":2,"text":"React 的 Fiber 架构采用 current 树与 workInProgress 树的双缓冲机制，其最主要的设计目的是什么？","opts":[{"l":"A","t":"通过复用节点大幅降低内存占用"},{"l":"B","t":"支持可中断的渲染过程与基于优先级的调度，使高优先级更新可以打断低优先级更新"},{"l":"C","t":"简化 Diff 算法的实现复杂度"},{"l":"D","t":"加快最终 commit 阶段的 DOM 操作速度"}],"key":"B","mode":"single","expl":"双缓冲的核心价值是让 React 可以在内存中构建新的 Fiber 树（workInProgress），并在任意时刻被高优先级任务打断，然后从断点继续或丢弃，最终一次 commit 到 DOM。这是 Concurrent 特性的基础。","modeTitle":"单选题"},{"n":3,"text":"在浏览器 JavaScript 事件循环（Event Loop）中，microtask 队列（如 Promise.then、queueMicrotask、MutationObserver）的执行时机是怎样的？","opts":[{"l":"A","t":"所有 macrotask 全部执行完毕后，才统一清空一次 microtask 队列"},{"l":"B","t":"每一个 macrotask 执行完成后，会立即清空当前 microtask 队列中的所有任务，然后再执行下一个 macrotask 或进行渲染"},{"l":"C","t":"只在浏览器进行页面渲染之前统一清空一次"},{"l":"D","t":"仅在主线程空闲时（requestIdleCallback）执行"}],"key":"B","mode":"single","expl":"规范明确规定：每执行完一个 macrotask，就会清空 microtask 队列，直到队列为空，然后才会进行渲染或执行下一个 macrotask。这是 Promise 能“插队”的根本原因。","modeTitle":"单选题"},{"n":4,"text":"TypeScript 的条件类型写作 \u003ccode>T extends U ? X : Y\u003c/code>。当 T 是一个联合类型（Union Type）时，编译器会如何处理这个条件类型？","opts":[{"l":"A","t":"将联合类型取交集后再进行判断"},{"l":"B","t":"对联合类型中的每一个成员分别进行条件判断（分配性 / distributive），然后将结果重新组成联合类型"},{"l":"C","t":"直接将整个条件类型收敛为 never"},{"l":"D","t":"编译器会报错，提示无法对联合类型进行条件判断"}],"key":"B","mode":"single","expl":"TypeScript 条件类型对联合类型默认是分布式的（distributive conditional types）。例如 \u003ccode>T extends any ? T[] : never\u003c/code> 当 T 为 \u003ccode>A | B\u003c/code> 时会变成 \u003ccode>A[] | B[]\u003c/code>。","modeTitle":"单选题"},{"n":5,"text":"Vite 在开发服务器启动时会对依赖进行预构建（optimizeDeps），其最核心要解决的问题是什么？","opts":[{"l":"A","t":"减少浏览器发起的 HTTP 请求数量"},{"l":"B","t":"将项目中使用的 CommonJS 或 UMD 格式的依赖转换为 ESM 格式，并进行缓存，避免开发时反复进行格式转换"},{"l":"C","t":"实现生产环境级别的 Tree-shaking"},{"l":"D","t":"为所有依赖生成完整的 SourceMap"}],"key":"B","mode":"single","expl":"浏览器原生 ESM 无法直接处理 CommonJS 依赖。Vite 在首次启动时用 esbuild 把依赖转成 ESM 并缓存到 \u003ccode>node_modules/.vite\u003c/code>，后续直接复用，这是开发启动快的关键。","modeTitle":"单选题"},{"n":6,"text":"Webpack 的 Module Federation（模块联邦）在运行时加载远程模块的核心实现原理是基于什么？","opts":[{"l":"A","t":"传统的 JSONP 回调加载"},{"l":"B","t":"动态 import（dynamic import）结合共享作用域（share scope）来管理远程模块与共享依赖"},{"l":"C","t":"通过 Service Worker 拦截请求并注入模块"},{"l":"D","t":"将远程模块编译为 WebAssembly 后加载"}],"key":"B","mode":"single","expl":"Module Federation 运行时通过 \u003ccode>__webpack_require__.l\u003c/code> 等实现动态加载远程入口，并使用 share scope 解决共享依赖的版本协商问题。","modeTitle":"单选题"},{"n":7,"text":"在 Koa 的中间件洋葱模型（onion model）中，当一个中间件执行到 \u003ccode>await next()\u003c/code> 之后的代码时，其执行时机是？","opts":[{"l":"A","t":"所有后续（下游）中间件全部执行完毕并返回后"},{"l":"B","t":"当前整个请求生命周期结束时"},{"l":"C","t":"下一个中间件即将开始执行之前"},{"l":"D","t":"仅在错误捕获中间件被触发时"}],"key":"A","mode":"single","expl":"洋葱模型的执行顺序是：中间件1前半 → 中间件2前半 → … → 最内层 → 中间件2后半 → 中间件1后半。\u003ccode>await next()\u003c/code> 之后的代码属于“返回”阶段。","modeTitle":"单选题"},{"n":8,"text":"Vue Router 在使用 HTML5 History 模式（mode: 'history'）时，如果浏览器不支持 \u003ccode>history.pushState\u003c/code> API，框架实际的降级策略是什么？","opts":[{"l":"A","t":"自动强制切换为 hash 模式"},{"l":"B","t":"回退到 abstract 模式（内存路由）"},{"l":"C","t":"使用 \u003ccode>location.replace\u003c/code> 模拟路由跳转"},{"l":"D","t":"完全依赖服务端配置，前端不做任何降级"}],"key":"A","mode":"single","expl":"Vue Router 源码中会检测 \u003ccode>supportsPushState\u003c/code>，不支持时自动 fallback 到 hash 模式。","modeTitle":"单选题"},{"n":9,"text":"在 React 的 StrictMode 下（开发环境），\u003ccode>useEffect\u003c/code> 的清理函数（cleanup function）会额外被触发一次的主要原因是？","opts":[{"l":"A","t":"为了模拟组件“挂载 → 卸载 → 再挂载”的过程，帮助开发者发现副作用没有正确清理的问题"},{"l":"B","t":"为了强制所有副作用同步执行，避免异步问题"},{"l":"C","t":"为了更严格地比较依赖数组是否发生变化"},{"l":"D","t":"为了提前触发垃圾回收，降低内存占用"}],"key":"A","mode":"single","expl":"StrictMode 在开发环境会故意双调用 mount → unmount → mount，用于暴露“订阅了但没取消订阅”等副作用问题。","modeTitle":"单选题"},{"n":10,"text":"使用运行时 CSS-in-JS 方案（如 styled-components、emotion 的 runtime 模式）时，最主要的性能瓶颈通常出现在哪个环节？","opts":[{"l":"A","t":"样式规则本身的计算（CSS 解析）"},{"l":"B","t":"大量动态生成的样式导致频繁的 CSSOM 操作，以及样式缓存失效带来的重复计算与插入"},{"l":"C","t":"JavaScript 引擎解析组件代码的速度"},{"l":"D","t":"样式文件的网络请求时间"}],"key":"B","mode":"single","expl":"运行时 CSS-in-JS 的最大问题是每次渲染都可能产生新的 style 标签或修改 CSSOM，导致样式重计算和缓存失效，尤其在大型应用中非常明显。","modeTitle":"单选题"},{"n":11,"text":"Node.js 的 Stream 实现了背压（backpressure）机制。它主要通过什么方式来控制数据的生产与消费速度，防止内存溢出？","opts":[{"l":"A","t":"限制事件监听器（EventEmitter）的最大数量"},{"l":"B","t":"通过 \u003ccode>highWaterMark\u003c/code> 阈值，当缓冲区达到阈值时，\u003ccode>writable.write()\u003c/code> 返回 false，并触发 \u003ccode>drain\u003c/code> 事件，或可读流调用 \u003ccode>pause()\u003c/code> / \u003ccode>resume()\u003c/code>"},{"l":"C","t":"强制所有读写操作变为同步执行"},{"l":"D","t":"使用全局 Buffer 池进行内存复用"}],"key":"B","mode":"single","expl":"这是 Node.js Stream 文档明确描述的背压实现方式。","modeTitle":"单选题"},{"n":12,"text":"Vue3 的模板编译器会把带有 \u003ccode>v-if\u003c/code> / \u003ccode>v-for\u003c/code> 等动态指令的模板编译成带有 Block Tree 的渲染函数。其最核心的目的是什么？","opts":[{"l":"A","t":"单纯减少生成的虚拟 DOM 节点总数量"},{"l":"B","t":"通过 Block Tree + PatchFlags 实现“靶向更新”，在更新时可以跳过大量静态节点的 Diff 比较"},{"l":"C","t":"主要为了支持服务端渲染（SSR）的流式输出"},{"l":"D","t":"简化运行时 Patch 算法的代码量"}],"key":"B","mode":"single","expl":"Block Tree 让 Vue 知道哪些节点是动态的，PatchFlags 进一步标记动态类型，更新时可以跳过静态内容，这是 Vue3 性能提升的核心编译优化。","modeTitle":"单选题"},{"n":13,"text":"React Concurrent 模式中引入的 Lane 模型，相比旧版本的 expirationTime 优先级模型，最主要的改进是什么？","opts":[{"l":"A","t":"使用位掩码（bitmask）表示优先级集合，支持更细粒度的优先级划分，并能更高效地处理批量更新与优先级合并"},{"l":"B","t":"彻底取消了时间切片（Time Slicing）机制"},{"l":"C","t":"强制所有更新都变为同步渲染"},{"l":"D","t":"移除了对 Suspense 的支持"}],"key":"A","mode":"single","expl":"Lane 用 31 位的 bitmask 表示优先级，可以同时表达多个优先级，并进行快速合并与比较，比单一的 expirationTime 数字更灵活。","modeTitle":"单选题"},{"n":14,"text":"Webpack 的 Tree-shaking（摇树优化）要真正生效，最关键、最容易被忽略的前提条件是什么？","opts":[{"l":"A","t":"代码必须使用 ES Module 语法，并且在 package.json 中正确配置 \u003ccode>sideEffects\u003c/code> 字段，告诉打包工具哪些文件是有副作用的"},{"l":"B","t":"只要开启 production mode 就会自动完整生效"},{"l":"C","t":"必须使用 Babel 进行转译"},{"l":"D","t":"必须配置 optimization.splitChunks"}],"key":"A","mode":"single","expl":"没有正确的 \u003ccode>sideEffects\u003c/code> 标记，即使是 ES Module，Webpack 也不敢随意删除代码，因为可能有副作用。","modeTitle":"单选题"},{"n":15,"text":"前端曾经广泛讨论的 HTTP/2 Server Push 功能，在现代浏览器中逐渐被弃用或不再推荐使用的最主要原因是什么？","opts":[{"l":"A","t":"推送的资源与浏览器缓存策略难以协调，容易推送浏览器已经缓存或实际不需要的资源，造成带宽浪费"},{"l":"B","t":"安全性存在重大漏洞"},{"l":"C","t":"该功能只支持 HTTPS，限制了使用场景"},{"l":"D","t":"实现复杂度过高，浏览器厂商不愿维护"}],"key":"A","mode":"single","expl":"Server Push 的最大问题是“推了但浏览器其实已经有缓存”或“推了但页面暂时用不到”，导致浪费。这也是它被 Cache Digest 等方案尝试解决、最终逐渐边缘化的原因。","modeTitle":"单选题"},{"n":16,"text":"Pinia 相比 Vuex 在设计上最核心的差异（也是它对 TypeScript 更友好的原因）是什么？","opts":[{"l":"A","t":"去除了 mutations 的概念，允许直接修改 state（内部通过 Proxy 处理），并提供了更自然的 TypeScript 类型推断"},{"l":"B","t":"强制所有 store 必须使用 class 语法编写"},{"l":"C","t":"底层仍然依赖 Vuex 的兼容层"},{"l":"D","t":"只支持 Composition API，完全不支持 Options API"}],"key":"A","mode":"single","expl":"Pinia 直接修改 state 的设计 + 完善的类型推导，是它对 Vuex 的重大改进。","modeTitle":"单选题"},{"n":17,"text":"在前端开发中，使用 WeakMap 来存储 DOM 节点与其关联数据（例如事件回调、组件实例）时，最核心的优势是什么？","opts":[{"l":"A","t":"WeakMap 的键是弱引用，当 DOM 节点被移除且没有其他强引用时，对应的数据可以被垃圾回收，有效避免内存泄漏"},{"l":"B","t":"WeakMap 支持 for...of 迭代"},{"l":"C","t":"WeakMap 的读写性能显著高于普通 Map"},{"l":"D","t":"WeakMap 可以被 JSON 序列化"}],"key":"A","mode":"single","expl":"这是 WeakMap 在前端最经典的使用场景（例如在库内部关联 DOM 与数据）。","modeTitle":"单选题"},{"n":18,"text":"Vite 的热更新（HMR）能够做到精确边界更新，而不是整页刷新，其最关键的机制是什么？","opts":[{"l":"A","t":"模块通过 \u003ccode>import.meta.hot.accept\u003c/code> 显式声明自己接受哪些更新，从而定义清晰的 HMR 边界"},{"l":"B","t":"仅依赖文件的修改时间戳进行判断"},{"l":"C","t":"通过兼容 Webpack 的 HMR runtime 实现"},{"l":"D","t":"默认对所有模块都进行全局重新加载后再局部替换"}],"key":"A","mode":"single","expl":"Vite 的 HMR 完全依赖模块自己声明 \u003ccode>import.meta.hot.accept\u003c/code>，形成明确的更新边界。","modeTitle":"单选题"},{"n":19,"text":"React 的 Reconciliation（协调）算法在处理列表时，强制要求使用稳定的 key，其本质作用是什么？","opts":[{"l":"A","t":"单纯提高列表的渲染速度"},{"l":"B","t":"帮助 reconciler 准确识别哪些节点是“同一个”节点，从而最大化地复用 DOM，最小化移动、新增和删除操作"},{"l":"C","t":"强制列表中的每个组件在更新时都重新创建"},{"l":"D","t":"优化事件委托的绑定方式"}],"key":"B","mode":"single","expl":"key 的本质是身份标识，让 Diff 算法知道“这是移动”还是“这是删除后新增”。","modeTitle":"单选题"},{"n":20,"text":"在大型前端应用中，使用 Web Worker 将复杂计算移出主线程时，最容易被开发者忽略、却经常成为实际性能瓶颈的点是什么？","opts":[{"l":"A","t":"主线程与 Worker 之间通过 \u003ccode>postMessage\u003c/code> 传递数据时，结构化克隆（structured clone）算法带来的序列化与反序列化开销"},{"l":"B","t":"创建 Worker 线程本身的 CPU 与内存成本"},{"l":"C","t":"Worker 无法使用 SharedArrayBuffer 导致的内存无法共享"},{"l":"D","t":"Worker 内部的调试工具不完善"}],"key":"A","mode":"single","expl":"结构化克隆的开销经常比计算本身还大，尤其是传递大型对象或 TypedArray 时。这也是 SharedArrayBuffer + Atomics 存在的原因。","modeTitle":"单选题"}],"modeTitle":"第一部分 · 单选题"},{"mode":"multiple","name":"二、不定项选择题（每题至少有一个正确答案，可能多选）","items":[{"n":21,"text":"关于 Vue3 响应式系统中 effect、依赖收集（track）与触发更新（trigger）的机制，以下描述正确的有：","opts":[{"l":"A","t":"依赖收集（track）发生在 Proxy 的 get 拦截器中，当 effect 执行时会自动收集当前正在运行的 effect"},{"l":"B","t":"默认情况下 trigger 会同步执行所有相关 effect，但可以通过传入 scheduler 选项将其改为异步执行（如 queueJob）"},{"l":"C","t":"computed 内部实现是一个 lazy 的 effect，只有在被访问时才会执行计算函数"},{"l":"D","t":"当修改数组的 length 属性时，会触发该数组上所有索引位置的依赖"}],"key":"ABC","mode":"multiple","expl":"D 错误。修改 \u003ccode>arr.length = 0\u003c/code> 主要触发 length 依赖，并不会自动触发所有索引的依赖（除非之前访问过那些索引）。","modeTitle":"不定项选择题"},{"n":22,"text":"关于 React Fiber 架构中优先级调度与时间切片的正确说法有：","opts":[{"l":"A","t":"高优先级的更新可以中断正在进行的低优先级渲染过程"},{"l":"B","t":"Lane 模型使用位运算（bitmask）来表示一组优先级，便于进行优先级合并与判断"},{"l":"C","t":"时间切片的实现主要依赖 MessageChannel 或 setTimeout 将任务切分到多个宏任务中"},{"l":"D","t":"无论优先级如何，所有更新在最终 commit 阶段都必须同步完成 DOM 操作"}],"key":"ABC","mode":"multiple","expl":"D 错误。低优先级任务被中断后，其之前做的工作可能被丢弃，只有最终 commit 阶段是同步且不可中断的。","modeTitle":"不定项选择题"},{"n":23,"text":"关于 TypeScript 高级类型与类型编程（类型体操）的正确理解有：","opts":[{"l":"A","t":"\u003ccode>infer\u003c/code> 关键字只能出现在条件类型的 \u003ccode>extends\u003c/code> 子句中"},{"l":"B","t":"过深的递归条件类型在某些 TypeScript 版本中会导致编译器性能严重下降甚至报错"},{"l":"C","t":"可以通过 Mapped Types 实现深度只读类型（DeepReadonly）"},{"l":"D","t":"在联合类型中，\u003ccode>never\u003c/code> 类型会被自动剔除（吸收）"}],"key":"ABCD","mode":"multiple","expl":"全部正确。这是 TypeScript 类型系统的基础常识。","modeTitle":"不定项选择题"},{"n":24,"text":"关于 Vite 与 Webpack 在开发体验与生产构建上的核心差异，以下正确的有：","opts":[{"l":"A","t":"Vite 开发服务器基于浏览器原生 ESM，冷启动速度极快，几乎不需要打包"},{"l":"B","t":"Webpack 的 HMR 更新粒度通常比 Vite 更精确，更新体积也更小"},{"l":"C","t":"Vite 的生产构建底层默认使用 Rollup"},{"l":"D","t":"目前 Webpack 的 Module Federation 方案在生产环境的成熟度与稳定性整体优于 Vite 的联邦方案"}],"key":"ACD","mode":"multiple","expl":"B 错误。实际上 Vite 的 HMR 通常更快、更精确，因为基于 ESM 的边界更清晰。","modeTitle":"不定项选择题"},{"n":25,"text":"关于 Koa 与 Express 在中间件机制上的主要区别，正确的描述有：","opts":[{"l":"A","t":"Koa 基于 async/await 实现了真正的洋葱模型（从外到内进入，再从内到外返回）"},{"l":"B","t":"Express 的中间件本质上是线性执行的，错误处理需要专门的错误中间件（带 4 个参数）"},{"l":"C","t":"Koa 将请求（req）和响应（res）统一封装到了 ctx 对象中"},{"l":"D","t":"两者在错误的自动传播与捕获机制上完全相同"}],"key":"ABC","mode":"multiple","expl":"D 错误。Koa 的错误会沿着洋葱模型自动向后传播，Express 需要手动 next(err)。","modeTitle":"不定项选择题"},{"n":26,"text":"关于当前主流前端状态管理库（Redux Toolkit、Pinia、Zustand）的架构特点，正确的有：","opts":[{"l":"A","t":"Redux Toolkit 内部默认集成了 Immer，允许开发者以“可变”的写法实现不可变更新"},{"l":"B","t":"Pinia 天然支持定义多个独立的 store，不再需要像 Vuex 那样嵌套 modules"},{"l":"C","t":"Zustand 基于简单的闭包 + 订阅发布模式实现，包体积非常小"},{"l":"D","t":"这三个库都强制开发者遵循严格的单向数据流，并禁止在任何情况下直接修改 state"}],"key":"ABC","mode":"multiple","expl":"D 错误。Zustand 和 Pinia 都允许直接修改 state（内部做了处理），并不强制“禁止直接修改”。","modeTitle":"不定项选择题"},{"n":27,"text":"关于前端虚拟列表（Virtual List / Windowing）的实现要点，正确的有：","opts":[{"l":"A","t":"需要精确计算当前可视区域（viewport）以及上下 buffer 区域，只渲染这部分 DOM"},{"l":"B","t":"当列表项高度不固定（动态高度）时，通常需要维护一个高度缓存或使用预估高度 + 动态测量"},{"l":"C","t":"滚动事件处理中使用 requestAnimationFrame 或 lodash.throttle 可以有效降低计算与渲染频率"},{"l":"D","t":"只有使用 Canvas 绘制才能获得最佳的虚拟列表性能"}],"key":"ABC","mode":"multiple","expl":"D 错误。目前主流虚拟列表都是基于 DOM 的，Canvas 方案（如 react-window 的某些实验）并非必须，且有无障碍和事件处理问题。","modeTitle":"不定项选择题"},{"n":28,"text":"关于前端常用网络协议与相关优化手段的正确理解有：","opts":[{"l":"A","t":"HTTP/3 基于 QUIC 协议，从根本上解决了 TCP 队头阻塞问题"},{"l":"B","t":"WebSocket 的连接建立过程本质上是一次带有 Upgrade 头的特殊 HTTP 请求"},{"l":"C","t":"GraphQL 常见的 over-fetching 问题可以通过 Persisted Queries（持久化查询）等方式缓解"},{"l":"D","t":"Server-Sent Events（SSE）天然支持客户端与服务端的双向实时通信"}],"key":"ABC","mode":"multiple","expl":"D 错误。SSE 是服务端到客户端的单向通道，双向通信需要 WebSocket。","modeTitle":"不定项选择题"},{"n":29,"text":"关于 Webpack 性能优化与其内部机制的正确说法有：","opts":[{"l":"A","t":"\u003ccode>optimization.splitChunks\u003c/code> 的 \u003ccode>cacheGroups\u003c/code> 配置可以对公共模块的提取进行非常精细的控制"},{"l":"B","t":"ModuleConcatenationPlugin（Scope Hoisting）可以把多个模块合并到一个作用域中，减少函数闭包与运行时开销"},{"l":"C","t":"生产模式下 Webpack 默认会使用 TerserPlugin 进行代码压缩，并配合 ES Module 进行 Tree-shaking"},{"l":"D","t":"Webpack 的所有 loader 都必须是同步执行的，不支持异步 loader"}],"key":"ABC","mode":"multiple","expl":"D 错误。Webpack 支持返回 Promise 的异步 loader。","modeTitle":"不定项选择题"},{"n":30,"text":"关于 React 与 Vue 在核心更新机制上的对比，正确的描述有：","opts":[{"l":"A","t":"Vue3 通过编译时的静态提升（hoistStatic）、PatchFlags 等优化，可以显著减少运行时需要 Diff 的工作量"},{"l":"B","t":"React 更依赖运行时的启发式 Diff 算法以及基于优先级的可中断调度"},{"l":"C","t":"两者在处理列表更新时，都依赖开发者提供的 key 来识别节点身份"},{"l":"D","t":"Vue3 的 Fragment 与 React 的 Fragment 在最终生成的真实 DOM 结构处理上完全一致"}],"key":"ABC","mode":"multiple","expl":"D 错误。Vue 的 Fragment 在某些情况下会处理得更接近真实 DOM 结构，两者在多根节点和空节点处理上仍有细微差异。","modeTitle":"不定项选择题"}],"modeTitle":"第二部分 · 不定项选择题"}]},{"n":2,"title":"模拟试卷 2","subject":"前端专家架构师方向","sections":[{"mode":"single","name":"一、单选题（每题只有一个正确答案）","items":[{"n":1,"text":"Vue3 中 \u003ccode>nextTick\u003c/code> 的实现原理是什么？它如何保证在 DOM 更新完成后执行回调？","opts":[{"l":"A","t":"直接使用 \u003ccode>setTimeout(fn, 0)\u003c/code>"},{"l":"B","t":"优先使用微任务（Promise.then 或 MutationObserver），并在同一事件循环中将多个 nextTick 回调合并到一个队列中执行"},{"l":"C","t":"使用 \u003ccode>requestAnimationFrame\u003c/code> 保证在渲染前执行"},{"l":"D","t":"通过 \u003ccode>Object.defineProperty\u003c/code> 监听 DOM 变化后触发"}],"key":"B","mode":"single","expl":"Vue3 的 \u003ccode>nextTick\u003c/code> 源码优先采用微任务，并将回调推入队列，在同一 tick 内多次调用只会执行一次刷新。这保证了在数据更新触发的 DOM 更新之后执行。","modeTitle":"单选题"},{"n":2,"text":"React 18 中自动批处理（Automatic Batching）的核心实现依赖什么机制？","opts":[{"l":"A","t":"仅在事件处理函数中生效"},{"l":"B","t":"通过统一的 \u003ccode>setState\u003c/code> 调度队列，将同一事件循环内的多次更新合并，即使是在 Promise、setTimeout 或原生事件中也会批处理"},{"l":"C","t":"依赖 Fiber 的双缓冲机制"},{"l":"D","t":"通过 \u003ccode>unstable_batchedUpdates\u003c/code> 手动开启"}],"key":"B","mode":"single","expl":"React 18 把批处理从“仅事件处理函数”扩展到了所有场景，通过统一的调度队列实现，即使是 setTimeout、Promise 中的更新也会被合并。","modeTitle":"单选题"},{"n":3,"text":"在 JavaScript 中，Proxy 的 \u003ccode>get\u003c/code> 陷阱（trap）被触发的时机，以下哪种情况描述最准确？","opts":[{"l":"A","t":"只有当属性值发生改变时才会触发"},{"l":"B","t":"只要通过 Proxy 实例访问属性（包括读取原型链上的属性），就会触发 get 陷阱"},{"l":"C","t":"仅当属性是自身可枚举属性时触发"},{"l":"D","t":"只有在严格模式下才会触发"}],"key":"B","mode":"single","expl":"只要对 Proxy 对象进行属性读取，就会触发 get 陷阱，包括访问继承来的属性（会先触发 get，再沿着原型链查找）。","modeTitle":"单选题"},{"n":4,"text":"TypeScript 中，\u003ccode>satisfies\u003c/code> 操作符（TS 4.9+）相比传统的类型断言（\u003ccode>as\u003c/code>）最核心的优势是什么？","opts":[{"l":"A","t":"可以改变值的类型"},{"l":"B","t":"在保持值原有类型推断的同时，检查该值是否满足指定的类型约束，避免类型被拓宽或变窄过度"},{"l":"C","t":"性能更高"},{"l":"D","t":"只能用于接口类型"}],"key":"B","mode":"single","expl":"\u003ccode>satisfies\u003c/code> 的核心价值是“校验但不改变推断结果”，解决了 \u003ccode>as\u003c/code> 断言可能掩盖错误，以及直接注解类型导致字面量类型丢失的问题。","modeTitle":"单选题"},{"n":5,"text":"Vite 插件中 \u003ccode>transform\u003c/code> 钩子与 \u003ccode>load\u003c/code> 钩子的主要区别是什么？","opts":[{"l":"A","t":"\u003ccode>load\u003c/code> 用于转换代码，\u003ccode>transform\u003c/code> 用于加载模块内容"},{"l":"B","t":"\u003ccode>load\u003c/code> 钩子用于自定义模块加载逻辑（返回模块内容），\u003ccode>transform\u003c/code> 钩子用于对已加载的模块代码进行转换"},{"l":"C","t":"两者完全等价，只是命名不同"},{"l":"D","t":"\u003ccode>transform\u003c/code> 只在生产构建时生效"}],"key":"B","mode":"single","expl":"这是 Vite 插件 API 的标准分工：\u003ccode>load\u003c/code> 负责提供模块源码，\u003ccode>transform\u003c/code> 负责转换源码。","modeTitle":"单选题"},{"n":6,"text":"Webpack 中 Loader 的执行顺序是怎样的？","opts":[{"l":"A","t":"从左到右（配置数组从前往后）执行"},{"l":"B","t":"从右到左（配置数组从后往前）执行，且 pitch 阶段从左到右，normal 阶段从右到左"},{"l":"C","t":"随机顺序执行"},{"l":"D","t":"只按文件扩展名决定顺序"}],"key":"B","mode":"single","expl":"Webpack Loader 的执行遵循 pitch 从左到右、normal 从右到左的经典顺序，这是理解 loader 链式调用的关键。","modeTitle":"单选题"},{"n":7,"text":"Koa 中，当中间件抛出错误后，错误是如何传播的？","opts":[{"l":"A","t":"错误会被自动吞掉，不会影响后续中间件"},{"l":"B","t":"错误会沿着洋葱模型向后传播，直到被错误处理中间件捕获或到达最外层"},{"l":"C","t":"只会触发当前中间件的 try/catch"},{"l":"D","t":"必须手动调用 \u003ccode>ctx.throw\u003c/code> 才会传播"}],"key":"B","mode":"single","expl":"Koa 的错误会顺着 \u003ccode>await next()\u003c/code> 的返回路径向后抛出，直到被捕获。","modeTitle":"单选题"},{"n":8,"text":"Vue Router 4 中，导航守卫 \u003ccode>beforeResolve\u003c/code> 与 \u003ccode>beforeEach\u003c/code> 的主要区别是什么？","opts":[{"l":"A","t":"\u003ccode>beforeResolve\u003c/code> 在所有组件内守卫和异步路由组件被解析之后调用，而 \u003ccode>beforeEach\u003c/code> 在导航被确认之前最早调用"},{"l":"B","t":"两者执行时机完全相同"},{"l":"C","t":"\u003ccode>beforeResolve\u003c/code> 只在路由懒加载时触发"},{"l":"D","t":"\u003ccode>beforeEach\u003c/code> 不能取消导航"}],"key":"A","mode":"single","expl":"这是 Vue Router 官方文档明确的执行时机差异，\u003ccode>beforeResolve\u003c/code> 更靠后。","modeTitle":"单选题"},{"n":9,"text":"React 中 \u003ccode>useTransition\u003c/code> 返回的 \u003ccode>startTransition\u003c/code> 标记的更新，其优先级在 Lane 模型中属于哪一类？","opts":[{"l":"A","t":"同步最高优先级（SyncLane）"},{"l":"B","t":"过渡更新优先级（TransitionLane），可以被更高优先级的紧急更新打断"},{"l":"C","t":"空闲优先级（IdleLane）"},{"l":"D","t":"与普通 setState 优先级完全相同"}],"key":"B","mode":"single","expl":"\u003ccode>startTransition\u003c/code> 会创建 Transition 优先级的 Lane，允许被用户输入等更高优先级任务打断。","modeTitle":"单选题"},{"n":10,"text":"在 CSS 性能优化中，\u003ccode>content-visibility: auto\u003c/code> 的核心作用是什么？","opts":[{"l":"A","t":"强制开启 GPU 加速"},{"l":"B","t":"让浏览器跳过渲染视口外的内容，并可以跳过其样式计算与布局，从而显著提升长页面的渲染性能"},{"l":"C","t":"自动压缩图片"},{"l":"D","t":"仅对 flex 布局生效"}],"key":"B","mode":"single","expl":"\u003ccode>content-visibility: auto\u003c/code> 是现代浏览器提供的强力渲染优化手段，配合 \u003ccode>contain-intrinsic-size\u003c/code> 使用效果更佳。","modeTitle":"单选题"},{"n":11,"text":"Node.js 的 \u003ccode>worker_threads\u003c/code> 与 \u003ccode>cluster\u003c/code> 模块在适用场景上的最核心区别是什么？","opts":[{"l":"A","t":"\u003ccode>worker_threads\u003c/code> 适合 CPU 密集型任务且共享内存，\u003ccode>cluster\u003c/code> 适合创建多进程处理 I/O 密集型请求并实现负载均衡"},{"l":"B","t":"两者完全可以互换"},{"l":"C","t":"\u003ccode>cluster\u003c/code> 可以共享内存，\u003ccode>worker_threads\u003c/code> 不行"},{"l":"D","t":"\u003ccode>worker_threads\u003c/code> 只能用于主线程通信"}],"key":"A","mode":"single","expl":"这是两者定位的本质区别：线程 vs 进程，共享内存 vs 独立内存。","modeTitle":"单选题"},{"n":12,"text":"Vue3 的 \u003ccode>&lt;KeepAlive&gt;\u003c/code> 组件在内部是如何缓存组件实例的？","opts":[{"l":"A","t":"使用普通的对象字典存储 vnode"},{"l":"B","t":"通过 LRU 缓存策略管理缓存的组件实例，并在 deactivated 时保留实例而不销毁"},{"l":"C","t":"直接缓存真实 DOM"},{"l":"D","t":"只缓存组件的 props"}],"key":"B","mode":"single","expl":"KeepAlive 内部维护了一个 LRU 缓存，通过 \u003ccode>activated\u003c/code>/\u003ccode>deactivated\u003c/code> 生命周期控制缓存组件的状态。","modeTitle":"单选题"},{"n":13,"text":"React Server Components（RSC）与传统 SSR 最本质的区别是什么？","opts":[{"l":"A","t":"RSC 只是另一种 SSR 实现"},{"l":"B","t":"RSC 允许组件在服务端运行，且客户端不会下载该组件的 JavaScript 代码，数据获取与渲染都可以留在服务端"},{"l":"C","t":"RSC 必须使用流式渲染"},{"l":"D","t":"RSC 不能与客户端组件混合使用"}],"key":"B","mode":"single","expl":"RSC 的核心创新在于“零客户端打包成本”的服务端组件，与传统 SSR（仍然需要下载组件代码进行 hydrate）有本质不同。","modeTitle":"单选题"},{"n":14,"text":"Webpack 5 的持久化缓存（Persistent Caching）默认缓存位置与失效策略的关键点是什么？","opts":[{"l":"A","t":"缓存在内存中，每次启动都失效"},{"l":"B","t":"默认将缓存写入磁盘（node_modules/.cache），并根据文件内容哈希、配置哈希等决定是否失效"},{"l":"C","t":"只缓存 loader 结果"},{"l":"D","t":"需要手动配置才开启"}],"key":"B","mode":"single","expl":"Webpack 5 默认开启磁盘持久化缓存，并通过多种哈希确保缓存正确性。","modeTitle":"单选题"},{"n":15,"text":"在前端监控中，INP（Interaction to Next Paint）指标衡量的是什么？它取代了哪个旧指标？","opts":[{"l":"A","t":"衡量页面加载性能，取代了 FCP"},{"l":"B","t":"衡量用户交互到下一次绘制的延迟，取代了 FID（First Input Delay）"},{"l":"C","t":"衡量布局偏移，取代了 CLS"},{"l":"D","t":"衡量首屏时间，取代了 LCP"}],"key":"B","mode":"single","expl":"INP 是 Core Web Vitals 的新交互指标，已经正式取代 FID。","modeTitle":"单选题"},{"n":16,"text":"Zustand 中间件 \u003ccode>persist\u003c/code> 的核心实现原理是什么？","opts":[{"l":"A","t":"使用 Proxy 深度监听 state 变化并自动写入 localStorage"},{"l":"B","t":"通过订阅 store 的变化，在变更时将序列化后的状态写入存储，并在初始化时恢复"},{"l":"C","t":"依赖 Redux 的 persist 实现"},{"l":"D","t":"只支持 sessionStorage"}],"key":"B","mode":"single","expl":"Zustand 的 persist 中间件是典型的订阅 + 序列化存储模式。","modeTitle":"单选题"},{"n":17,"text":"JavaScript 中 Generator 函数与 async 函数在执行机制上的最核心区别是什么？","opts":[{"l":"A","t":"Generator 是惰性的，需要手动调用 next() 推进，async 函数自动执行并返回 Promise"},{"l":"B","t":"两者完全相同"},{"l":"C","t":"Generator 不能使用 yield"},{"l":"D","t":"async 函数不能被中断"}],"key":"A","mode":"single","expl":"Generator 是可暂停的迭代器，async/await 是 Generator + 自动执行器（Promise）的语法糖升级版。","modeTitle":"单选题"},{"n":18,"text":"Vite 的 SSR 场景下，\u003ccode>ssrLoadModule\u003c/code> 与普通客户端模块加载的主要区别是什么？","opts":[{"l":"A","t":"没有区别"},{"l":"B","t":"\u003ccode>ssrLoadModule\u003c/code> 会以 Node.js 环境执行模块，并处理 CJS/ESM 互操作，同时不会进行客户端 HMR 相关注入"},{"l":"C","t":"只用于生产环境"},{"l":"D","t":"必须配合 Remix 使用"}],"key":"B","mode":"single","expl":"\u003ccode>ssrLoadModule\u003c/code> 是 Vite SSR 的核心 API，专门为 Node 环境设计。","modeTitle":"单选题"},{"n":19,"text":"React 的 \u003ccode>useDeferredValue\u003c/code> 与 \u003ccode>useTransition\u003c/code> 在使用场景上的主要差异是什么？","opts":[{"l":"A","t":"完全等价"},{"l":"B","t":"\u003ccode>useDeferredValue\u003c/code> 用于延迟更新某个具体的值（通常是由 props 或 state 衍生），而 \u003ccode>useTransition\u003c/code> 用于标记一次状态更新为过渡更新"},{"l":"C","t":"\u003ccode>useDeferredValue\u003c/code> 优先级更高"},{"l":"D","t":"只能在类组件中使用"}],"key":"B","mode":"single","expl":"两者都用于并发特性，但抽象层级不同：一个针对“值”，一个针对“更新”。","modeTitle":"单选题"},{"n":20,"text":"在大型应用路由设计中，采用“路由级代码分割 + 数据预加载（如 React Router loader 或 Vue Router 的异步组件 + 守卫）”时，最容易导致的性能问题是什么？","opts":[{"l":"A","t":"首屏白屏时间必然增加"},{"l":"B","t":"如果数据加载与组件加载没有做好并行或瀑布流控制，容易产生请求瀑布（waterfall），反而降低性能"},{"l":"C","t":"只会增加打包体积"},{"l":"D","t":"对 SEO 完全无影响"}],"key":"B","mode":"single","expl":"路由数据预加载如果设计成串行瀑布流，会严重拖慢页面呈现，这是实际项目中非常常见的性能陷阱。","modeTitle":"单选题"}],"modeTitle":"第一部分 · 单选题"},{"mode":"multiple","name":"二、不定项选择题（每题至少有一个正确答案，可能多选）","items":[{"n":21,"text":"关于 Vue3 的调度系统（scheduler）与 \u003ccode>queueJob\u003c/code> 的正确描述有：","opts":[{"l":"A","t":"同一组件的多次更新会被去重，只执行一次"},{"l":"B","t":"默认使用微任务（Promise）进行异步更新"},{"l":"C","t":"可以通过 \u003ccode>flush: 'sync'\u003c/code> 强制同步执行"},{"l":"D","t":"父组件的更新一定会在子组件之前执行"}],"key":"ABC","mode":"multiple","expl":"D 错误。Vue 的更新顺序是子组件先于父组件（与 React 相反），这是由组件依赖收集顺序决定的。","modeTitle":"不定项选择题"},{"n":22,"text":"关于 React 18 Concurrent 特性的正确理解有：","opts":[{"l":"A","t":"\u003ccode>useTransition\u003c/code> 标记的更新可以被紧急更新打断"},{"l":"B","t":"Suspense 在 Concurrent 模式下可以更好地实现“先展示旧内容，再替换新内容”"},{"l":"C","t":"所有 setState 默认都变成了可中断的"},{"l":"D","t":"\u003ccode>startTransition\u003c/code> 内部会创建 TransitionLane"}],"key":"ABD","mode":"multiple","expl":"C 错误。只有被 \u003ccode>startTransition\u003c/code> 标记或使用了并发特性的更新才是可中断的，普通更新默认仍是同步的（在 React 18 中事件处理内仍会批处理）。","modeTitle":"不定项选择题"},{"n":23,"text":"关于 TypeScript 模块增强（Module Augmentation）与声明合并的正确说法有：","opts":[{"l":"A","t":"可以对已有的接口进行扩展（declaration merging）"},{"l":"B","t":"可以对第三方库的模块进行类型增强"},{"l":"C","t":"模块增强必须写在 \u003ccode>.d.ts\u003c/code> 文件中才能生效"},{"l":"D","t":"命名空间（namespace）也支持合并"}],"key":"ABD","mode":"multiple","expl":"C 错误。模块增强可以写在普通 \u003ccode>.ts\u003c/code> 文件中，只要被包含在编译范围内即可。","modeTitle":"不定项选择题"},{"n":24,"text":"关于 Vite 插件系统的正确描述有：","opts":[{"l":"A","t":"插件钩子执行顺序受 \u003ccode>enforce: 'pre' | 'post'\u003c/code> 影响"},{"l":"B","t":"\u003ccode>config\u003c/code> 钩子可以修改 Vite 配置"},{"l":"C","t":"开发服务器与生产构建使用完全相同的插件执行逻辑"},{"l":"D","t":"支持与 Rollup 插件兼容（通过适配）"}],"key":"ABD","mode":"multiple","expl":"C 错误。开发与生产的插件执行在部分钩子上有差异（例如有些钩子仅开发生效）。","modeTitle":"不定项选择题"},{"n":25,"text":"关于 Webpack 代码分割（Code Splitting）的正确实践有：","opts":[{"l":"A","t":"动态 \u003ccode>import()\u003c/code> 是最常用的分割点"},{"l":"B","t":"\u003ccode>splitChunks.cacheGroups\u003c/code> 可以用来提取第三方库与公共业务代码"},{"l":"C","t":"过度分割会导致请求数量过多，反而影响性能"},{"l":"D","t":"入口配置多个 entry 就等于完成了最优代码分割"}],"key":"ABC","mode":"multiple","expl":"D 错误。多入口只是初步分割，真正的优化依赖 splitChunks 与动态导入。","modeTitle":"不定项选择题"},{"n":26,"text":"关于前端状态管理中选择器（Selector）与性能优化的正确理解有：","opts":[{"l":"A","t":"Reselect 或类似库通过记忆化（memoization）避免不必要的重新计算"},{"l":"B","t":"在 Redux 中，如果 mapStateToProps 返回新引用，即使数据没变也会导致组件重渲染"},{"l":"C","t":"Zustand 的 selector 如果不使用浅比较，也可能导致多余渲染"},{"l":"D","t":"所有状态管理库都内置了自动记忆化选择器"}],"key":"ABC","mode":"multiple","expl":"D 错误。大多数库需要开发者显式使用记忆化选择器或浅比较。","modeTitle":"不定项选择题"},{"n":27,"text":"关于现代 CSS 性能相关特性的正确描述有：","opts":[{"l":"A","t":"\u003ccode>content-visibility: auto\u003c/code> 可以跳过视口外内容的渲染工作"},{"l":"B","t":"CSS Containment（\u003ccode>contain\u003c/code>）可以限制样式、布局、绘制的影响范围"},{"l":"C","t":"\u003ccode>will-change\u003c/code> 使用不当会造成大量内存占用"},{"l":"D","t":"使用 CSS-in-JS 一定比 CSS Modules 性能更好"}],"key":"ABC","mode":"multiple","expl":"D 错误。CSS-in-JS 运行时方案通常性能不如静态的 CSS Modules 或原子化 CSS。","modeTitle":"不定项选择题"},{"n":28,"text":"关于 Node.js 异步上下文与监控的正确说法有：","opts":[{"l":"A","t":"\u003ccode>AsyncLocalStorage\u003c/code> 可以在异步调用链中传递上下文而不用显式传参"},{"l":"B","t":"\u003ccode>async_hooks\u003c/code> 是更底层的 API，可用于实现 AsyncLocalStorage"},{"l":"C","t":"在高并发场景下，AsyncLocalStorage 几乎没有性能开销"},{"l":"D","t":"可以用于实现请求级别的日志追踪（request id）"}],"key":"ABD","mode":"multiple","expl":"C 错误。AsyncLocalStorage 在极高并发下仍有一定开销，需要谨慎评估。","modeTitle":"不定项选择题"},{"n":29,"text":"关于前端实时通信方案对比的正确理解有：","opts":[{"l":"A","t":"WebSocket 是全双工协议，适合高频双向通信"},{"l":"B","t":"Server-Sent Events 实现更简单，自动重连，适合服务端向客户端推送"},{"l":"C","t":"长轮询（Long Polling）在连接数较多时对服务器压力通常大于 WebSocket"},{"l":"D","t":"HTTP/2 的 Server Push 可以完全替代 WebSocket"}],"key":"ABC","mode":"multiple","expl":"D 错误。Server Push 无法实现真正的双向实时通信，也不能替代 WebSocket。","modeTitle":"不定项选择题"},{"n":30,"text":"关于虚拟 DOM Diff 算法优化的正确认知有：","opts":[{"l":"A","t":"React 的 Diff 是启发式的，同层比较，时间复杂度 O(n)"},{"l":"B","t":"Vue3 通过编译时信息（PatchFlags、Block Tree）进一步减少了运行时 Diff 的节点数量"},{"l":"C","t":"key 的稳定性对列表 Diff 结果影响巨大"},{"l":"D","t":"双端比较（旧 Vue2 的做法）在任何情况下都优于 React 的从左到右比较"}],"key":"ABC","mode":"multiple","expl":"D 错误。双端比较并非在所有场景都更优，React 的简单同层比较 + key 在实践中已经足够高效，且更易实现优先级与可中断。","modeTitle":"不定项选择题"}],"modeTitle":"第二部分 · 不定项选择题"}]},{"n":3,"title":"模拟试卷 3","subject":"前端专家架构师方向","sections":[{"mode":"single","name":"一、单选题（每题只有一个正确答案）","items":[{"n":1,"text":"Vue3 中 \u003ccode>effectScope\u003c/code> 的核心作用是什么？","opts":[{"l":"A","t":"仅用于创建独立的响应式作用域，与组件无关"},{"l":"B","t":"创建一个可以统一收集和管理内部所有 effect 的作用域，方便一次性停止（stop）这些 effect，常用于组件卸载或手动控制生命周期"},{"l":"C","t":"替代 \u003ccode>reactive\u003c/code> 和 \u003ccode>ref\u003c/code>"},{"l":"D","t":"只在 SSR 场景下生效"}],"key":"B","mode":"single","expl":"\u003ccode>effectScope\u003c/code> 是 Vue3 提供的手动控制 effect 生命周期的 API，组件内部其实也隐式使用了它，卸载时会 stop 整个 scope。","modeTitle":"单选题"},{"n":2,"text":"React 中 \u003ccode>useSyncExternalStore\u003c/code> 钩子设计的最主要目的是什么？","opts":[{"l":"A","t":"替代 \u003ccode>useState\u003c/code>"},{"l":"B","t":"让外部 store（如 Redux、Zustand、浏览器 API）能正确接入 React 的并发渲染，避免 tearing（撕裂）问题，并支持服务端渲染时的 hydration 一致性"},{"l":"C","t":"仅用于优化性能"},{"l":"D","t":"只能在客户端组件中使用"}],"key":"B","mode":"single","expl":"这是 React 18 为了让外部订阅与并发渲染安全兼容而专门设计的钩子，解决 tearing 和 SSR hydration 问题。","modeTitle":"单选题"},{"n":3,"text":"在 JavaScript 中，\u003ccode>FinalizationRegistry\u003c/code> 的主要使用场景是什么？","opts":[{"l":"A","t":"替代 \u003ccode>WeakMap\u003c/code>"},{"l":"B","t":"当一个对象被垃圾回收时，执行注册的清理回调，常用于清理与该对象关联的外部资源（如 WebSocket、文件句柄），但回调执行时机不确定"},{"l":"C","t":"强制立即回收对象"},{"l":"D","t":"提高对象访问性能"}],"key":"B","mode":"single","expl":"FinalizationRegistry 是弱引用清理的补充，但执行时机不保证，不能依赖它做精确的资源释放时机控制。","modeTitle":"单选题"},{"n":4,"text":"TypeScript 中，使用 Template Literal Types 实现路由路径类型约束时，最核心的能力是什么？","opts":[{"l":"A","t":"只能做简单的字符串拼接"},{"l":"B","t":"可以在类型层面对字符串进行模式匹配、提取参数、实现类型安全的路由参数推断"},{"l":"C","t":"运行时也会生效"},{"l":"D","t":"只能用于枚举"}],"key":"B","mode":"single","expl":"Template Literal Types + infer 可以在类型系统里实现类似正则的路径参数提取，是类型安全路由的基础。","modeTitle":"单选题"},{"n":5,"text":"Vite 在依赖预构建（optimizeDeps）时，如果遇到一个依赖内部使用了动态 \u003ccode>require\u003c/code>，默认处理策略是什么？","opts":[{"l":"A","t":"直接报错退出"},{"l":"B","t":"尝试将其转换为 ESM，但动态 require 可能导致预构建失败或运行时问题，需要手动配置 \u003ccode>optimizeDeps.exclude\u003c/code> 或 \u003ccode>include\u003c/code>"},{"l":"C","t":"自动转成 CommonJS 并忽略"},{"l":"D","t":"强制使用 esbuild 的最激进转换"}],"key":"B","mode":"single","expl":"动态 require 是 ESM 预构建的常见痛点，需要开发者手动干预。","modeTitle":"单选题"},{"n":6,"text":"Webpack 5 的 Asset Modules 相比旧版 \u003ccode>file-loader\u003c/code> / \u003ccode>url-loader\u003c/code> 的核心优势是什么？","opts":[{"l":"A","t":"完全没有区别"},{"l":"B","t":"内置支持，无需额外 loader，通过 \u003ccode>type: 'asset'\u003c/code> 等配置即可自动处理资源的内联或输出，并支持更精细的条件判断"},{"l":"C","t":"只能处理图片"},{"l":"D","t":"必须配合 html-webpack-plugin 使用"}],"key":"B","mode":"single","expl":"Asset Modules 是 Webpack 5 的重要改进，减少了 loader 配置负担。","modeTitle":"单选题"},{"n":7,"text":"Koa 的 \u003ccode>ctx.state\u003c/code> 与 \u003ccode>ctx.request.body\u003c/code> 的主要区别是什么？","opts":[{"l":"A","t":"完全相同"},{"l":"B","t":"\u003ccode>ctx.state\u003c/code> 是 getter/setter，内部代理了 body，但推荐在中间件中统一使用，且需要 body parser 中间件支持；直接修改 \u003ccode>ctx.body\u003c/code> 才是设置响应体"},{"l":"C","t":"\u003ccode>ctx.state\u003c/code> 只能读取"},{"l":"D","t":"\u003ccode>ctx.request.body\u003c/code> 用于设置响应"}],"key":"B","mode":"single","expl":"Koa 的 ctx 设计统一了请求与响应，但 body 的处理仍需中间件配合。","modeTitle":"单选题"},{"n":8,"text":"在 React Router 6.4+ 的 Data Router 中，\u003ccode>loader\u003c/code> 函数的执行时机与特点是什么？","opts":[{"l":"A","t":"只在客户端路由跳转后执行"},{"l":"B","t":"在路由匹配后、组件渲染前执行，支持服务端与客户端，且可以通过 \u003ccode>defer\u003c/code> 实现延迟加载数据，与组件加载并行"},{"l":"C","t":"必须返回 Promise"},{"l":"D","t":"只能用于获取静态数据"}],"key":"B","mode":"single","expl":"Data Router 的 loader 是 React Router 向“数据优先”路由迈进的核心，支持 defer 实现流式与并行。","modeTitle":"单选题"},{"n":9,"text":"Vue3 的 Teleport 组件在实现上最关键的点是什么？","opts":[{"l":"A","t":"只是简单的 DOM 移动"},{"l":"B","t":"通过在编译阶段和运行时把内容渲染到指定的目标容器，同时保持组件逻辑树（父子关系、provide/inject、事件等）不变"},{"l":"C","t":"必须使用原生 \u003ccode>&lt;dialog&gt;\u003c/code>"},{"l":"D","t":"只支持 body 作为目标"}],"key":"B","mode":"single","expl":"Teleport 保持了逻辑树与渲染位置的分离，这是它与简单 DOM 操作的本质区别。","modeTitle":"单选题"},{"n":10,"text":"CSS View Transitions API 的核心能力是什么？","opts":[{"l":"A","t":"仅用于页面切换动画"},{"l":"B","t":"允许开发者在 DOM 更新前后捕获前后状态，并自动创建可自定义的过渡动画，可大幅简化复杂的共享元素过渡与页面切换效果"},{"l":"C","t":"替代所有 CSS 动画"},{"l":"D","t":"目前只有 Chrome 支持且无法自定义"}],"key":"B","mode":"single","expl":"View Transitions API 是原生提供的强大页面与元素过渡能力，正在快速普及。","modeTitle":"单选题"},{"n":11,"text":"Node.js 的 \u003ccode>diagnostics_channel\u003c/code> 模块主要用途是什么？","opts":[{"l":"A","t":"替代 console.log"},{"l":"B","t":"提供轻量级的诊断通道，用于在模块间发布和订阅诊断事件，常用于 APM、日志、性能追踪，对性能影响极小"},{"l":"C","t":"只用于测试"},{"l":"D","t":"强制开启所有调试信息"}],"key":"B","mode":"single","expl":"diagnostics_channel 是 Node.js 官方推荐的轻量诊断方案，比自己 hack EventEmitter 更标准。","modeTitle":"单选题"},{"n":12,"text":"在微前端架构中，Module Federation 与 qiankun（基于 single-spa）最本质的区别之一是什么？","opts":[{"l":"A","t":"没有本质区别"},{"l":"B","t":"Module Federation 更偏向构建时与运行时的模块共享与依赖协商，而 qiankun 更侧重应用的加载、沙箱隔离与生命周期管理"},{"l":"C","t":"qiankun 不支持样式隔离"},{"l":"D","t":"Module Federation 无法实现独立部署"}],"key":"B","mode":"single","expl":"两者解决的问题重心不同，实际项目中也常结合使用。","modeTitle":"单选题"},{"n":13,"text":"React 的 \u003ccode>useId\u003c/code> 钩子解决的核心问题是什么？","opts":[{"l":"A","t":"生成随机 ID"},{"l":"B","t":"在服务端渲染与客户端 hydration 过程中生成稳定且一致的唯一 ID，避免 hydration mismatch，同时支持同一组件多次调用"},{"l":"C","t":"仅用于表单"},{"l":"D","t":"性能优于 uuid 库"}],"key":"B","mode":"single","expl":"\u003ccode>useId\u003c/code> 专门解决 SSR 场景下 ID 不一致导致的 hydration 警告。","modeTitle":"单选题"},{"n":14,"text":"Vite 的 Library Mode 在打包时默认的行为特点是什么？","opts":[{"l":"A","t":"与普通应用打包完全相同"},{"l":"B","t":"会将代码打包成适合库分发的格式（如 es、cjs、umd），默认不处理 CSS 的提取方式与应用模式不同，且外部化依赖需要手动配置"},{"l":"C","t":"强制开启代码分割"},{"l":"D","t":"只能输出 ESM"}],"key":"B","mode":"single","expl":"Library Mode 有自己的默认配置与最佳实践，与应用模式有明显差异。","modeTitle":"单选题"},{"n":15,"text":"在前端性能优化中，\u003ccode>scheduler.yield()\u003c/code>（或等价的让出主线程方案）的主要价值是什么？","opts":[{"l":"A","t":"加速计算"},{"l":"B","t":"在长任务中主动让出主线程，让浏览器有机会处理用户输入和高优先级任务，从而改善 INP 和页面响应性"},{"l":"C","t":"替代 requestIdleCallback"},{"l":"D","t":"只在 Worker 中有效"}],"key":"B","mode":"single","expl":"主动让出主线程是改善交互响应性的重要现代手段。","modeTitle":"单选题"},{"n":16,"text":"Valtio 这类基于 Proxy 的状态库与传统 Redux 的核心设计差异是什么？","opts":[{"l":"A","t":"完全相同"},{"l":"B","t":"Valtio 通过 Proxy 实现可变写法的响应式更新，订阅粒度可以到属性级别，而 Redux 强调不可变数据与单向数据流"},{"l":"C","t":"Valtio 必须配合 React 使用"},{"l":"D","t":"Redux 性能一定更好"}],"key":"B","mode":"single","expl":"Proxy 可变响应式 vs 不可变单向流，是当前状态管理的两大主流思想。","modeTitle":"单选题"},{"n":17,"text":"TypeScript 中 Branded Types（品牌类型 / 名义类型模拟）的主要用途是什么？","opts":[{"l":"A","t":"提高运行时性能"},{"l":"B","t":"在结构类型系统中通过交叉唯一标识类型，实现名义类型检查，防止例如 UserId 与 OrderId 混用"},{"l":"C","t":"替代 interface"},{"l":"D","t":"只能用于 class"}],"key":"B","mode":"single","expl":"Branded Types 是在 TypeScript 结构类型系统中模拟名义类型的常用技巧。","modeTitle":"单选题"},{"n":18,"text":"Webpack 的 \u003ccode>experiments\u003c/code> 配置中，\u003ccode>lazyCompilation\u003c/code> 的作用是什么？","opts":[{"l":"A","t":"开启 Tree-shaking"},{"l":"B","t":"在开发模式下对入口和动态导入的模块进行懒编译，只有当模块真正被访问时才编译，从而显著加快冷启动速度"},{"l":"C","t":"只用于生产环境"},{"l":"D","t":"替代 HMR"}],"key":"B","mode":"single","expl":"lazyCompilation 是 Webpack 提升大型项目开发启动速度的重要实验特性。","modeTitle":"单选题"},{"n":19,"text":"在 Vue3 自定义指令中，\u003ccode>mounted\u003c/code> 与 \u003ccode>updated\u003c/code> 钩子的执行时机差异是什么？","opts":[{"l":"A","t":"没有差异"},{"l":"B","t":"\u003ccode>mounted\u003c/code> 在元素被插入父节点后调用一次，\u003ccode>updated\u003c/code> 在元素自身或子树的 VNode 更新后调用，可能多次"},{"l":"C","t":"\u003ccode>updated\u003c/code> 只在 props 变化时触发"},{"l":"D","t":"两者都会在 SSR 时执行"}],"key":"B","mode":"single","expl":"这是 Vue 自定义指令生命周期的标准行为。","modeTitle":"单选题"},{"n":20,"text":"前端使用 WebTransport 协议相比传统 WebSocket 的主要优势是什么？","opts":[{"l":"A","t":"完全兼容 HTTP/1.1"},{"l":"B","t":"基于 HTTP/3（QUIC），支持双向流、不可靠数据报、更好的拥塞控制，并减少队头阻塞，适合低延迟高吞吐场景"},{"l":"C","t":"浏览器支持度已经超过 WebSocket"},{"l":"D","t":"实现更简单，无需握手"}],"key":"B","mode":"single","expl":"WebTransport 是面向未来的高性能传输协议，尤其适合实时音视频与游戏场景。","modeTitle":"单选题"}],"modeTitle":"第一部分 · 单选题"},{"mode":"multiple","name":"二、不定项选择题（每题至少有一个正确答案，可能多选）","items":[{"n":21,"text":"关于 Vue3 响应式系统中 \u003ccode>watch\u003c/code> 与 \u003ccode>watchEffect\u003c/code> 的正确描述有：","opts":[{"l":"A","t":"\u003ccode>watchEffect\u003c/code> 会立即执行，并自动收集依赖"},{"l":"B","t":"\u003ccode>watch\u003c/code> 默认是懒执行的，需要指定 source"},{"l":"C","t":"两者都支持 \u003ccode>flush: 'sync' | 'post' | 'pre'\u003c/code>"},{"l":"D","t":"\u003ccode>watch\u003c/code> 无法监听响应式对象的深层变化"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>watch\u003c/code> 通过 \u003ccode>deep: true\u003c/code> 可以监听深层变化。","modeTitle":"不定项选择题"},{"n":22,"text":"关于 React 并发渲染中“撕裂”（Tearing）问题的正确理解有：","opts":[{"l":"A","t":"撕裂是指在一次渲染中，不同组件看到的外部 store 数据不一致"},{"l":"B","t":"\u003ccode>useSyncExternalStore\u003c/code> 是解决撕裂的官方推荐方式"},{"l":"C","t":"在非并发模式下不会出现撕裂"},{"l":"D","t":"使用 \u003ccode>useState\u003c/code> 管理的数据也会出现撕裂"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>useState\u003c/code> 管理的数据在 React 内部是一致的，不会出现外部 store 那样的撕裂。","modeTitle":"不定项选择题"},{"n":23,"text":"关于 TypeScript 递归类型与性能的正确认知有：","opts":[{"l":"A","t":"过深的递归类型会导致编译时间显著增加甚至达到深度限制"},{"l":"B","t":"TypeScript 对递归类型有一定的深度限制（历史上约 50 层，后续有优化）"},{"l":"C","t":"使用接口（interface）有时比 type 别名在递归场景下更高效"},{"l":"D","t":"所有递归类型都会在运行时产生开销"}],"key":"ABC","mode":"multiple","expl":"D 错误。递归类型只是编译时的，运行时没有额外开销。","modeTitle":"不定项选择题"},{"n":24,"text":"关于 Vite 与底层 esbuild / Rollup 协作的正确说法有：","opts":[{"l":"A","t":"开发阶段依赖预构建主要使用 esbuild"},{"l":"B","t":"生产构建默认使用 Rollup"},{"l":"C","t":"esbuild 对 TypeScript 的类型检查是完整的"},{"l":"D","t":"可以通过插件在开发与生产中共享大部分逻辑"}],"key":"ABD","mode":"multiple","expl":"C 错误。esbuild 只做转译，不做完整的 TypeScript 类型检查。","modeTitle":"不定项选择题"},{"n":25,"text":"关于微前端沙箱隔离方案的正确理解有：","opts":[{"l":"A","t":"快照沙箱通过记录窗口对象变化并在切换时恢复"},{"l":"B","t":"Proxy 沙箱通过代理 window 实现更细粒度的隔离"},{"l":"C","t":"样式隔离常用 CSS Module、Shadow DOM 或运行时前缀"},{"l":"D","t":"任何沙箱都能 100% 隔离所有副作用"}],"key":"ABC","mode":"multiple","expl":"D 错误。目前没有任何沙箱能做到绝对完美的隔离（例如某些原型链修改、定时器等）。","modeTitle":"不定项选择题"},{"n":26,"text":"关于现代前端状态管理中 Signal 范式（如 Solid、Vue Reactivity、Preact Signals、Angular Signals）的正确描述有：","opts":[{"l":"A","t":"Signal 通常基于拉取（pull）或推拉结合的细粒度更新"},{"l":"B","t":"可以做到只有真正用到变化数据的组件才更新"},{"l":"C","t":"与 React 的 useState 在更新粒度上完全一致"},{"l":"D","t":"实现上大多依赖 Proxy 或编译时转换"}],"key":"ABD","mode":"multiple","expl":"C 错误。Signal 的更新粒度通常远细于 React 的组件级更新。","modeTitle":"不定项选择题"},{"n":27,"text":"关于 CSS Cascade Layers（\u003ccode>@layer\u003c/code>）的正确理解有：","opts":[{"l":"A","t":"可以显式控制样式优先级，降低选择器权重带来的复杂性"},{"l":"B","t":"未分层的样式默认优先级高于已分层的样式"},{"l":"C","t":"可以用于更好地管理第三方库样式与业务样式的覆盖关系"},{"l":"D","t":"会改变 CSS 的继承规则"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>@layer\u003c/code> 主要影响层叠优先级，不改变继承。","modeTitle":"不定项选择题"},{"n":28,"text":"关于 Node.js 权限模型（Permission Model，实验性）的正确说法有：","opts":[{"l":"A","t":"可以限制文件系统访问、网络访问等"},{"l":"B","t":"通过 \u003ccode>--experimental-permission\u003c/code> 等标志开启"},{"l":"C","t":"已经完全稳定并默认开启"},{"l":"D","t":"有助于提升生产环境安全性"}],"key":"ABD","mode":"multiple","expl":"C 错误。权限模型目前仍是实验性特性。","modeTitle":"不定项选择题"},{"n":29,"text":"关于前端数据获取与缓存策略的正确实践有：","opts":[{"l":"A","t":"React Query / SWR / RTK Query 等都实现了请求去重、缓存、后台刷新等能力"},{"l":"B","t":"缓存的 key 设计对正确性与性能至关重要"},{"l":"C","t":"在 SSR 场景下需要特别注意缓存的 hydrate 与客户端一致性"},{"l":"D","t":"所有数据都应该使用永久缓存"}],"key":"ABC","mode":"multiple","expl":"D 错误。缓存策略必须根据数据新鲜度要求设计，永久缓存只适用于极少场景。","modeTitle":"不定项选择题"},{"n":30,"text":"关于长任务与主线程优化的正确认知有：","opts":[{"l":"A","t":"长任务（Long Task）会阻塞用户输入与渲染，直接影响 INP"},{"l":"B","t":"可以使用 \u003ccode>scheduler.yield()\u003c/code>、\u003ccode>isInputPending\u003c/code> 或将任务拆分到多个宏/微任务中缓解"},{"l":"C","t":"Web Worker 可以完全消除主线程长任务问题"},{"l":"D","t":"React 的时间切片与 Vue 的异步更新都是缓解长任务的手段"}],"key":"ABD","mode":"multiple","expl":"C 错误。Web Worker 适合计算密集型任务，但 DOM 操作与大部分用户交互仍必须在主线程。","modeTitle":"不定项选择题"}],"modeTitle":"第二部分 · 不定项选择题"}]},{"n":4,"title":"模拟试卷 4","subject":"前端专家架构师方向","sections":[{"mode":"single","name":"一、单选题（每题只有一个正确答案）","items":[{"n":1,"text":"Vue3 编译器在处理静态节点时会进行“静态提升”（hoistStatic），其最核心的收益是什么？","opts":[{"l":"A","t":"减少运行时创建虚拟节点的开销，将静态 vnode 提升到渲染函数外部，实现一次创建、多次复用"},{"l":"B","t":"强制所有节点变成静态"},{"l":"C","t":"只对文本节点生效"},{"l":"D","t":"主要为了减小打包体积"}],"key":"A","mode":"single","expl":"静态提升是 Vue3 编译优化的基础手段之一，避免每次渲染都重新创建静态 vnode。","modeTitle":"单选题"},{"n":2,"text":"React Compiler（原 React Forget）的核心目标是什么？","opts":[{"l":"A","t":"完全替代 Hooks"},{"l":"B","t":"通过编译时自动对组件进行记忆化（自动添加 memo、useMemo、useCallback 等），减少开发者手动优化的负担，同时保持语义正确性"},{"l":"C","t":"只做代码压缩"},{"l":"D","t":"必须配合服务端组件使用"}],"key":"B","mode":"single","expl":"React Compiler 的目标是让“正确的代码默认就有良好性能”，自动处理记忆化。","modeTitle":"单选题"},{"n":3,"text":"在 JavaScript 中，\u003ccode>import attributes\u003c/code>（原 import assertions）的主要用途是什么？","opts":[{"l":"A","t":"替代动态 import"},{"l":"B","t":"在导入模块时声明模块的类型或格式（如 \u003ccode>import data from './data.json' with { type: 'json' }\u003c/code>），让运行时和打包工具能正确处理非 JS 模块"},{"l":"C","t":"用于类型检查"},{"l":"D","t":"只在 Node.js 中生效"}],"key":"B","mode":"single","expl":"import attributes 是 ES 模块支持 JSON、CSS 等模块类型的标准方式。","modeTitle":"单选题"},{"n":4,"text":"TypeScript 5.0+ 引入的 \u003ccode>const\u003c/code> 类型参数（const type parameters）最主要的作用是什么？","opts":[{"l":"A","t":"提高运行时性能"},{"l":"B","t":"在泛型函数中更精确地推断字面量类型，避免类型被拓宽，常用于实现更严格的配置对象或事件类型"},{"l":"C","t":"替代 \u003ccode>as const\u003c/code>"},{"l":"D","t":"只能用于类"}],"key":"B","mode":"single","expl":"\u003ccode>const\u003c/code> 类型参数让泛型推断更精准，是 TypeScript 类型系统的重要增强。","modeTitle":"单选题"},{"n":5,"text":"Vite 的 Environment API（实验性）设计的主要目的是什么？","opts":[{"l":"A","t":"仅用于 CSS 处理"},{"l":"B","t":"提供统一的方式来支持多种运行时环境（客户端、SSR、边缘计算、自定义运行时），让插件和框架能更灵活地控制模块加载与转换"},{"l":"C","t":"替代现有的 SSR 方案"},{"l":"D","t":"只用于生产构建"}],"key":"B","mode":"single","expl":"Environment API 是 Vite 面向未来多运行时的重要抽象。","modeTitle":"单选题"},{"n":6,"text":"在 Webpack / Rspack 中，Module Federation 的 shared 配置里 \u003ccode>singleton: true\u003c/code> 的含义是什么？","opts":[{"l":"A","t":"强制使用最新版本"},{"l":"B","t":"确保该共享依赖在整个应用中只有一个实例，避免多版本并存导致的状态不一致或体积浪费"},{"l":"C","t":"只共享一次网络请求"},{"l":"D","t":"必须配合 eager 使用"}],"key":"B","mode":"single","expl":"\u003ccode>singleton\u003c/code> 是 Module Federation 中控制共享依赖实例数量的关键选项。","modeTitle":"单选题"},{"n":7,"text":"Koa 中间件中，\u003ccode>ctx.respond = false\u003c/code> 的作用是什么？","opts":[{"l":"A","t":"禁止所有响应"},{"l":"B","t":"告诉 Koa 不要自动处理响应（不自动发送 body、设置状态码等），由开发者完全接管响应逻辑，常用于代理、流式响应或 WebSocket 升级"},{"l":"C","t":"清空已有的 body"},{"l":"D","t":"只在错误处理时有效"}],"key":"B","mode":"single","expl":"这是 Koa 中实现流式响应、代理或协议升级的常用手段。","modeTitle":"单选题"},{"n":8,"text":"TanStack Router（或同类类型安全路由库）相比传统 React Router 的最大优势之一是什么？","opts":[{"l":"A","t":"打包体积更小"},{"l":"B","t":"通过 TypeScript 实现端到端的类型安全（路径参数、search params、loader 数据等），在编译期就能发现路由相关错误"},{"l":"C","t":"不需要配置路由表"},{"l":"D","t":"只支持文件路由"}],"key":"B","mode":"single","expl":"类型安全是 TanStack Router 等新一代路由库的核心卖点。","modeTitle":"单选题"},{"n":9,"text":"React 19 中 \u003ccode>useOptimistic\u003c/code> 钩子的核心使用场景是什么？","opts":[{"l":"A","t":"替代 useState"},{"l":"B","t":"在执行异步操作（如表单提交）时，先乐观更新 UI，等服务器响应后再回滚或确认，提升用户感知性能"},{"l":"C","t":"只用于列表删除"},{"l":"D","t":"必须配合 Server Actions 使用"}],"key":"B","mode":"single","expl":"乐观更新是提升感知性能的经典模式，\u003ccode>useOptimistic\u003c/code> 将其标准化。","modeTitle":"单选题"},{"n":10,"text":"CSS Scroll-Driven Animations 的核心能力是什么？","opts":[{"l":"A","t":"只能控制滚动条样式"},{"l":"B","t":"让动画的进度直接由滚动容器的滚动位置驱动，无需 JavaScript 监听 scroll 事件，性能更好且能实现复杂的视差与进度动画"},{"l":"C","t":"替代 IntersectionObserver"},{"l":"D","t":"目前所有浏览器都已稳定支持"}],"key":"B","mode":"single","expl":"Scroll-Driven Animations 是性能友好的声明式滚动动画方案。","modeTitle":"单选题"},{"n":11,"text":"Node.js 的 Single Executable Applications（SEA）功能的主要价值是什么？","opts":[{"l":"A","t":"加速模块加载"},{"l":"B","t":"将 Node.js 应用连同运行时打包成一个独立的可执行文件，方便分发与部署，减少对用户环境的依赖"},{"l":"C","t":"只支持 CommonJS"},{"l":"D","t":"已经完全取代 pkg 等工具且无任何限制"}],"key":"B","mode":"single","expl":"SEA 降低了 Node.js 应用的分发门槛。","modeTitle":"单选题"},{"n":12,"text":"在岛架构（Islands Architecture）中，“岛屿”的核心思想是什么？","opts":[{"l":"A","t":"整个页面都是客户端渲染"},{"l":"B","t":"页面大部分是静态 HTML，只有需要交互的部分（岛屿）才进行客户端 hydration 与 JavaScript 加载，从而显著减少客户端 JS 体积与 hydration 成本"},{"l":"C","t":"必须使用 Web Components"},{"l":"D","t":"与 SSR 完全对立"}],"key":"B","mode":"single","expl":"岛架构是 Astro 等框架推广的核心思想，平衡了静态与交互。","modeTitle":"单选题"},{"n":13,"text":"Vue3 的 Suspense 组件目前（截至稳定版本）的主要限制是什么？","opts":[{"l":"A","t":"完全不能使用"},{"l":"B","t":"对异步 setup 或异步组件提供了等待机制，但在 SSR 与错误处理边界上仍有限制，官方仍将其视为实验性或部分稳定"},{"l":"C","t":"只能包裹一个异步组件"},{"l":"D","t":"性能极差，不推荐使用"}],"key":"B","mode":"single","expl":"Suspense 在 Vue 中仍有实际使用限制，尤其在 SSR 场景。","modeTitle":"单选题"},{"n":14,"text":"React 的 \u003ccode>useActionState\u003c/code>（原 useFormState）主要解决什么问题？","opts":[{"l":"A","t":"管理普通 state"},{"l":"B","t":"简化基于表单的异步操作状态管理（pending、结果、错误），常与 Server Actions 或表单提交结合使用"},{"l":"C","t":"替代 useReducer"},{"l":"D","t":"只在客户端有效"}],"key":"B","mode":"single","expl":"它是 React 19 表单与 Actions 体系的重要组成部分。","modeTitle":"单选题"},{"n":15,"text":"在前端工程化中，Turborepo 的 Remote Caching 最核心的价值是什么？","opts":[{"l":"A","t":"只缓存 node_modules"},{"l":"B","t":"将构建与任务结果缓存到远程，使不同机器、不同 CI 流水线可以复用缓存，大幅加速 monorepo 的构建与测试"},{"l":"C","t":"替代 pnpm"},{"l":"D","t":"只支持 JavaScript 项目"}],"key":"B","mode":"single","expl":"Remote Caching 是 monorepo 规模化后的关键加速手段。","modeTitle":"单选题"},{"n":16,"text":"CSS Anchor Positioning 的主要用途是什么？","opts":[{"l":"A","t":"替代 flex 布局"},{"l":"B","t":"让元素相对于另一个“锚点”元素进行定位（无需额外 JS 计算位置），非常适合实现 tooltip、popover、下拉菜单等"},{"l":"C","t":"只对 fixed 定位生效"},{"l":"D","t":"会破坏文档流"}],"key":"B","mode":"single","expl":"Anchor Positioning 大幅简化了浮层类组件的定位逻辑。","modeTitle":"单选题"},{"n":17,"text":"JavaScript 中 \u003ccode>Iterator Helpers\u003c/code>（提案或已实现阶段）提供的能力是什么？","opts":[{"l":"A","t":"替代 Generator"},{"l":"B","t":"为迭代器提供类似数组的声明式方法（map、filter、take、drop 等），支持惰性计算，适合处理大数据流或无限序列"},{"l":"C","t":"只用于数组"},{"l":"D","t":"运行时会自动转成数组"}],"key":"B","mode":"single","expl":"Iterator Helpers 补齐了迭代器的声明式操作能力。","modeTitle":"单选题"},{"n":18,"text":"Vite 插件中 \u003ccode>configureServer\u003c/code> 与 \u003ccode>configurePreviewServer\u003c/code> 的主要区别是什么？","opts":[{"l":"A","t":"没有区别"},{"l":"B","t":"\u003ccode>configureServer\u003c/code> 用于开发服务器，\u003ccode>configurePreviewServer\u003c/code> 用于 \u003ccode>vite preview\u003c/code> 的预览服务器，两者可分别添加中间件"},{"l":"C","t":"只在生产环境生效"},{"l":"D","t":"必须同时实现"}],"key":"B","mode":"single","expl":"两者分别对应开发与预览场景，是 Vite 插件开发的常见钩子。","modeTitle":"单选题"},{"n":19,"text":"在状态管理中，Jotai 的原子（atom）模型与 Zustand 的核心差异是什么？","opts":[{"l":"A","t":"完全相同"},{"l":"B","t":"Jotai 采用自底向上的原子化状态，原子之间可以依赖，更新粒度更细；Zustand 更接近单一 store + selector 模式"},{"l":"C","t":"Jotai 不支持 TypeScript"},{"l":"D","t":"Zustand 无法实现派生状态"}],"key":"B","mode":"single","expl":"原子化 vs 单一 store 是当前状态管理的重要分野。","modeTitle":"单选题"},{"n":20,"text":"前端使用 WebCodecs API 的主要场景是什么？","opts":[{"l":"A","t":"替代 Canvas"},{"l":"B","t":"提供对音视频编解码的底层控制，适合实现高性能视频编辑、实时通信、自定义播放器等，而不必依赖重量级的 WASM 库"},{"l":"C","t":"只用于解码，不能编码"},{"l":"D","t":"已经完全取代 WebRTC"}],"key":"B","mode":"single","expl":"WebCodecs 打开了浏览器原生高性能媒体处理的大门。","modeTitle":"单选题"}],"modeTitle":"第一部分 · 单选题"},{"mode":"multiple","name":"二、不定项选择题（每题至少有一个正确答案，可能多选）","items":[{"n":21,"text":"关于 Vue3 编译优化中 PatchFlags 的正确描述有：","opts":[{"l":"A","t":"用于标记动态节点的具体动态类型（文本、class、style、props 等）"},{"l":"B","t":"运行时 patch 过程可以根据 PatchFlags 跳过不必要的比较"},{"l":"C","t":"所有节点都会被标记 PatchFlags"},{"l":"D","t":"与 Block Tree 配合使用效果最佳"}],"key":"ABD","mode":"multiple","expl":"C 错误。只有动态节点才会被标记 PatchFlags，静态节点直接跳过。","modeTitle":"不定项选择题"},{"n":22,"text":"关于 React 19 表单与 Server Actions 相关特性的正确理解有：","opts":[{"l":"A","t":"表单 action 可以直接接收异步函数"},{"l":"B","t":"\u003ccode>useFormStatus\u003c/code> 可以获取父级表单的提交状态"},{"l":"C","t":"Server Actions 只能在服务端组件中定义"},{"l":"D","t":"进度与乐观更新可以很好地结合 \u003ccode>useOptimistic\u003c/code>"}],"key":"ABD","mode":"multiple","expl":"C 错误。Server Actions 也可以在客户端组件中导入使用（通过特殊处理）。","modeTitle":"不定项选择题"},{"n":23,"text":"关于 TypeScript 项目引用（Project References）的正确说法有：","opts":[{"l":"A","t":"可以将大型项目拆分成多个子项目，加快类型检查与编译速度"},{"l":"B","t":"需要配置 \u003ccode>composite: true\u003c/code>"},{"l":"C","t":"子项目之间可以声明依赖关系"},{"l":"D","t":"完全不需要构建工具配合即可在运行时生效"}],"key":"ABC","mode":"multiple","expl":"D 错误。项目引用主要作用于类型检查与构建，运行时仍需打包工具处理。","modeTitle":"不定项选择题"},{"n":24,"text":"关于 Rspack 与 Webpack 的对比，正确的有：","opts":[{"l":"A","t":"Rspack 使用 Rust 编写，冷启动与构建速度显著更快"},{"l":"B","t":"Rspack 对 Webpack 生态（loader、plugin）有较高兼容性"},{"l":"C","t":"Rspack 已经 100% 兼容所有 Webpack 配置与插件"},{"l":"D","t":"两者都支持 Module Federation"}],"key":"ABD","mode":"multiple","expl":"C 错误。Rspack 兼容性 xt":"Node.js 内置的 \u003ccode>node:sqlite\u003c/code> 模块（稳定或接近稳定阶段）的主要价值是什么？","opts":[{"l":"A","t":"替代所有数据库"},{"l":"B","t":"提供官方支持的 SQLite 绑定，适合嵌入式、本地工具、小型应用或测试场景，减少对外部原生依赖的需求"},{"l":"C","t":"只能用于内存数据库"},{"l":"D","t":"性能超过 PostgreSQL"}],"key":"B","mode":"single","expl":"官方 SQLite 支持降低了嵌入式数据库的使用门槛。","modeTitle":"单选题"},{"n":12,"text":"Qwik 框架提出的 Resumability（可恢复性）与传统 Hydration 的核心区别是什么？","opts":[{"l":"A","t":"没有区别"},{"l":"B","t":"Resumability 不需要在客户端重新执行组件逻辑来恢复状态与事件绑定，而是通过序列化的方式直接“恢复”应用状态，从而大幅减少客户端启动成本"},{"l":"C","t":"必须使用 WebAssembly"},{"l":"D","t":"只适用于静态页面"}],"key":"B","mode":"single","expl":"Resumability 是 Qwik 区别于传统 Hydration 框架的核心创新。","modeTitle":"单选题"},{"n":13,"text":"Vue3 的自定义渲染器（Custom Renderer）API 的主要使用场景是什么？","opts":[{"l":"A","t":"只能用于 Web DOM"},{"l":"B","t":"允许将 Vue 的响应式与组件系统运行在非 DOM 环境（如 Canvas、WebGL、小程序、原生 UI、终端等），通过实现一组平台相关的节点操作接口即可"},{"l":"C","t":"替代 Vite 插件"},{"l":"D","t":"性能必然低于官方渲染器"}],"key":"B","mode":"single","expl":"自定义渲染器是 Vue 跨平台能力的基础。","modeTitle":"单选题"},{"n":14,"text":"Speculation Rules API 的主要作用是什么？","opts":[{"l":"A","t":"替代 Service Worker"},{"l":"B","t":"让开发者声明式地告诉浏览器哪些页面或资源可能被用户下一步访问，从而进行更智能的预取（prefetch）或预渲染（prerender），提升导航性能"},{"l":"C","t":"只用于 SEO"},{"l":"D","t":"强制浏览器立即加载所有链接"}],"key":"B","mode":"single","expl":"Speculation Rules 是浏览器原生的下一代预加载声明方式。","modeTitle":"单选题"},{"n":15,"text":"在前端性能监控中，Soft Navigations 的提出主要是为了解决什么问题？","opts":[{"l":"A","t":"衡量传统多页应用"},{"l":"B","t":"更准确地衡量 SPA 中通过客户端路由发生的“软导航”性能，弥补传统 Navigation Timing 只覆盖硬导航的不足"},{"l":"C","t":"替代 Core Web Vitals"},{"l":"D","t":"只统计加载时间"}],"key":"B","mode":"single","expl":"Soft Navigations 填补了 SPA 性能衡量的重要空白。","modeTitle":"单选题"},{"n":16,"text":"CSS \u003ccode>color-mix()\u003c/code> 函数的核心能力是什么？","opts":[{"l":"A","t":"只能混合 RGB"},{"l":"B","t":"在指定颜色空间中按比例混合两种颜色，并支持透明度，是现代 CSS 实现主题与动态颜色的重要工具"},{"l":"C","t":"替代 CSS 变量"},{"l":"D","t":"运行时性能极差"}],"key":"B","mode":"single","expl":"\u003ccode>color-mix()\u003c/code> 是 CSS 颜色处理现代化的重要进展。","modeTitle":"单选题"},{"n":17,"text":"JavaScript 新的 Set 方法（如 \u003ccode>intersection\u003c/code>、\u003ccode>union\u003c/code>、\u003ccode>difference\u003c/code> 等）的主要意义是什么？","opts":[{"l":"A","t":"只是语法糖"},{"l":"B","t":"提供标准化的集合运算，避免开发者反复手写这些常用操作，提高可读性与一致性"},{"l":"C","t":"只能用于数字"},{"l":"D","t":"会改变原 Set"}],"key":"B","mode":"single","expl":"标准化集合运算提升了代码质量与一致性。","modeTitle":"单选题"},{"n":18,"text":"Vite 的 SSR Manifest 的主要用途是什么？","opts":[{"l":"A","t":"仅用于开发"},{"l":"B","t":"记录生产构建中客户端资源与模块的映射关系，帮助服务端渲染时正确注入资源预加载与 hydration 所需的脚本和样式"},{"l":"C","t":"替代 package.json"},{"l":"D","t":"只包含 CSS 信息"}],"key":"B","mode":"single","expl":"SSR Manifest 是 Vite SSR 生产环境正确注入资源的关键文件。","modeTitle":"单选题"},{"n":19,"text":"在状态管理中，Legend-State 或类似细粒度响应式库强调的核心优化是什么？","opts":[{"l":"A","t":"与 Redux 完全相同"},{"l":"B","t":"通过极细粒度的可观察数据与精确订阅，实现“只有真正用到的数据变化才触发更新”，并尽量减少中间层开销"},{"l":"C","t":"必须使用 Proxy"},{"l":"D","t":"不支持异步"}],"key":"B","mode":"single","expl":"细粒度响应式是当前高性能状态库的共同追求。","modeTitle":"单选题"},{"n":20,"text":"Early Hints（HTTP 103）在前端性能优化中的主要价值是什么？","opts":[{"l":"A","t":"替代 HTTP/2 Server Push"},{"l":"B","t":"在服务器最终响应（200）之前，先发送可能需要的关键资源提示（如 CSS、字体），让浏览器尽早开始加载，从而改善 LCP 等指标"},{"l":"C","t":"只支持 HTTP/1.1"},{"l":"D","t":"会增加服务器负担且无实际收益"}],"key":"B","mode":"single","expl":"Early Hints 是改善 LCP 的有效服务器端优化手段。","modeTitle":"单选题"}],"modeTitle":"第一部分 · 单选题"},{"mode":"multiple","name":"二、不定项选择题（每题至少有一个正确答案，可能多选）","items":[{"n":21,"text":"关于 Vue3 \u003ccode>defineModel\u003c/code> 与传统 v-model 实现的正确描述有：","opts":[{"l":"A","t":"可以减少样板代码"},{"l":"B","t":"支持多个 v-model 绑定"},{"l":"C","t":"底层仍然是 prop + emit"},{"l":"D","t":"只能用于脚本 setup"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>defineModel\u003c/code> 主要在 \u003ccode>&lt;script setup&gt;\u003c/code> 中使用，但并非唯一限制点。","modeTitle":"不定项选择题"},{"n":22,"text":"关于 React \u003ccode>use\u003c/code> 钩子的正确理解有：","opts":[{"l":"A","t":"可以读取 Promise 并自动 Suspend"},{"l":"B","t":"可以读取 Context"},{"l":"C","t":"可以在条件判断、循环中调用"},{"l":"D","t":"完全不受 Hooks 规则约束，可以在任何地方调用"}],"key":"ABC","mode":"multiple","expl":"D 错误。\u003ccode>use\u003c/code> 虽然突破了 ,"t":"只对 hover 生效"}],"key":"B","mode":"single","expl":"\u003ccode>@starting-style\u003c/code> 补齐了 CSS 过渡的重要能力缺口。","modeTitle":"单选题"},{"n":11,"text":"Node.js 测试运行器中 \u003ccode>mock.timers\u003c/code> 的主要功能是什么？","opts":[{"l":"A","t":"加速测试执行"},{"l":"B","t":"模拟与控制 \u003ccode>setTimeout\u003c/code>、\u003ccode>setInterval\u003c/code>、\u003ccode>Date\u003c/code> 等计时器相关 API，使时间相关的测试变得可预测与快速"},{"l":"C","t":"只用于真实时间等待"},{"l":"D","t":"必须配合外部库使用"}],"key":"B","mode":"single","expl":"\u003ccode>mock.timers\u003c/code> 是测试时间相关逻辑的官方手段。","modeTitle":"单选题"},{"n":12,"text":"在 Resumability 架构中，事件处理的“懒恢复”机制通常如何工作？","opts":[{"l":"A","t":"页面加载时注册所有事件"},{"l":"B","t":"先通过全局委托或序列化信息记录事件需求，真正交互发生时再恢复对应的处理逻辑与状态，从而减少启动时的工作量"},{"l":"C","t":"完全不需要事件处理"},{"l":"D","t":"必须使用 WebAssembly"}],"key":"B","mode":"single","expl":"懒恢复是 Resumability 降低启动成本的核心机制之一。","modeTitle":"单选题"},{"n":13,"text":"Vue3 的 \u003ccode>onErrorCaptured\u003c/code> 钩子的主要作用是什么？","opts":[{"l":"A","t":"替代 try/catch"},{"l":"B","t":"在组件树中捕获后代组件的错误，可用于实现错误边界、上报与降级 UI"},{"l":"C","t":"只捕获异步错误"},{"l":"D","t":"会阻止所有错误向上传播且无法配置"}],"key":"B","mode":"single","expl":"\u003ccode>onErrorCaptured\u003c/code> 是 Vue 实现错误边界的主要方式。","modeTitle":"单选题"},{"n":14,"text":"前端使用 TransformStream 的主要场景是什么？","opts":[{"l":"A","t":"只用于字符串转换"},{"l":"B","t":"在流式数据处理管道中，对 ReadableStream 的数据块进行转换后再输出到 WritableStream，适合压缩、加解密、协议转换等场景"},{"l":"C","t":"必须一次性加载全部数据"},{"l":"D","t":"只能在 Worker 中使用"}],"key":"B","mode":"single","expl":"TransformStream 是流处理管道的核心构建块。","modeTitle":"单选题"},{"n":15,"text":"INP 优化中，减少 Presentation Delay 的常见有效手段是什么？","opts":[{"l":"A","t":"只优化网络"},{"l":"B","t":"降低事件处理后的渲染成本（减少 DOM 操作、样式重算、布局抖动），合理使用 \u003ccode>content-visibility\u003c/code>、CSS containment 等"},{"l":"C","t":"把所有工作放到 Worker"},{"l":"D","t":"强制同步渲染"}],"key":"B","mode":"single","expl":"Presentation Delay 的优化重点在渲染路径本身。","modeTitle":"单选题"},{"n":16,"text":"CSS \u003ccode>interpolate-size\u003c/code> 属性的主要用途是什么？","opts":[{"l":"A","t":"控制颜色插值"},{"l":"B","t":"允许对 \u003ccode>auto\u003c/code> 等关键 {"n":22,"text":"关于 React 乐观更新与表单 Actions 的正确理解有：","opts":[{"l":"A","t":"\u003ccode>useOptimistic\u003c/code> 可提升感知性能"},{"l":"B","t":"需要妥善处理操作失败后的回滚"},{"l":"C","t":"可与 Server Actions 良好配合"},{"l":"D","t":"乐观更新意味着不需要服务器确认"}],"key":"ABC","mode":"multiple","expl":"D 错误。乐观更新后仍需要服务器最终确认，失败时必须回滚。","modeTitle":"不定项选择题"},{"n":23,"text":"关于 TypeScript 模块解析策略的正确说法有：","opts":[{"l":"A","t":"\u003ccode>bundler\u003c/code> 解析更适合 Vite / Webpack 等打包场景"},{"l":"B","t":"\u003ccode>node16\u003c/code> / \u003ccode>nodenext\u003c/code> 严格遵循 Node.js ESM 规则"},{"l":"C","t":"\u003ccode>package.json\u003c/code> 的 \u003ccode>exports\u003c/code> 字段对解析结果影响很大"},{"l":"D","t":"所有策略对类型检查结果完全一致"}],"key":"ABC","mode":"multiple","expl":"D 错误。不同解析策略会导致类型检查与模块解析结果出现差异。","modeTitle":"不定项选择题"},{"n":24,"text":"关于 Web Worker 与主线程数据传递的正确认知有：","opts":[{"l":"A","t":"\u003ccode>postMessage\u003c/code> 默认使用结构化克隆，有开销"},{"l":"B","t":"\u003ccode>ArrayBuffer.transfer\u003c/code> 可实现零拷贝转移"},{"l":"C","t":"SharedArrayBuffer + Atomics 适合需要共享内存的场景"},{"l":"D","t":"所有数据传递都是零开销的"}],"key":"ABC","mode":"multiple","expl":"D 错误。结构化克隆与跨线程通信都有明确开销。","modeTitle":"不定项选择题"},{"n":25,"text":"关于导航阻塞与用户体验的正确实践有：","opts":[{"l":"A","t":"\u003ccode>useBlocker\u003c/code> 可用于未保存更改提示"},{"l":"B","t":"应避免过度阻塞导致用户无法离开页面"},{"l":"C","t":"需要考虑浏览器原生 beforeunload 的配合"},{"l":"D","t":"阻塞导航对 SEO 有正面帮助"}],"key":"ABC","mode":"multiple","expl":"D 错误。导航阻塞主要是 UX 与数据安全考虑，与 SEO 无直接正面关系。","modeTitle":"不定项选择题"},{"n":26,"text":"关于 CSS 进入动画与尺寸过渡的正确描述有：","opts":[{"l":"A","t":"\u003ccode>@starting-style\u003c/code> 解决首次渲染过渡问题"},{"l":"B","t":"\u003ccode>interpolate-size\u003c/code> 允许 auto 尺寸参与插值"},{"l":"C","t":"两者都能改善现代 UI 的动画体验"},{"l":"D","t":"这些特性可以完全替代 JavaScript 动画库"}],"key":"ABC","mode":"multiple","expl":"D 错误。复杂动画与手势场景仍需要 JavaScript 或动画库。","modeTitle":"不定项选择题"},{"n":27,"text":"关于流处理 API 的正确理解有：","opts":[{"l":"A","t":"TransformStream 适合构建数据处理管道"},{"l":"B","t":"ReadableStream 支持 BYOB（Bring Your Own Buffer）读取器以降低内存分配"},{"l":"C","t":"pipeTo / pipeThrough 可简化流的连接"},{
